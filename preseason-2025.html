<style>
:root{
  --bg:#0b0d10;--fg:#e8ecf0;--muted:#7a8194;
  --accent:#8b5cf6;--accent2:#ec4899;
  --good:#16a34a;--bad:#dc2626;--warn:#ca8a04;
  --card:rgba(255,255,255,0.03);--glass:rgba(255,255,255,0.05);
  --border:rgba(255,255,255,0.07);
  --font:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --maxw:1200px;--prosew:760px;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--fg);font-family:var(--font);overflow-x:hidden;line-height:1.5;}
a{color:var(--accent2);text-decoration:none;}
a:hover{text-decoration:underline;}
.light{--bg:#f7f9fc;--fg:#111418;--muted:#5f6672;--card:rgba(0,0,0,0.03);--glass:rgba(0,0,0,0.04);--border:rgba(0,0,0,0.08);color-scheme:light;}
@view-transition{navigation:auto;}::view-transition-old(root){animation:vt-out .2s ease-in;}::view-transition-new(root){animation:vt-in .3s ease-out;}@keyframes vt-out{to{opacity:0;filter:blur(2px);}}@keyframes vt-in{from{opacity:0;filter:blur(2px);}}
.scroll-progress{position:fixed;top:0;left:0;height:3px;z-index:200;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0%;transition:width .1s linear;pointer-events:none;}
.reveal{opacity:0;transform:translateY(20px);transition:opacity .5s cubic-bezier(.17,.67,.24,1),transform .5s cubic-bezier(.17,.67,.24,1);}
.reveal.vis{opacity:1;transform:none;}

/* --- Hero --- */
.hero{max-width:var(--prosew);margin:0 auto;padding:4.5rem 1.5rem 2.5rem;text-align:center;}
.hero .kicker{font-size:.78rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:1rem;}
.hero h1{font-size:clamp(1.9rem,5.5vw,3.1rem);font-weight:800;letter-spacing:-.02em;line-height:1.12;margin-bottom:1rem;background:linear-gradient(135deg,var(--fg) 55%,var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;}
.hero .sub{color:var(--muted);font-size:1rem;max-width:560px;margin:0 auto 1.4rem;}
.hero .rule{width:64px;height:3px;margin:0 auto;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent2));}

/* --- Prose sections --- */
.prose-sec{max-width:var(--prosew);margin:0 auto;padding:2.2rem 1.5rem 1rem;}
.prose-sec h2{font-size:clamp(1.35rem,3vw,1.8rem);font-weight:800;letter-spacing:-.01em;margin-bottom:1.1rem;}
.prose-sec h2 .idx{color:var(--accent);margin-right:.55rem;font-weight:800;}
.prose-sec p{font-size:1.02rem;line-height:1.72;color:var(--fg);margin-bottom:1.15rem;}
.prose-sec p:last-child{margin-bottom:0;}
#sec-cold-open p:first-of-type::first-letter{font-size:3.1em;font-weight:800;float:left;line-height:.85;padding:.06em .12em 0 0;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;}
#sec-kickoff-eve p:last-of-type{font-weight:600;}

/* --- Rankings --- */
.rankings-wrap{max-width:900px;margin:0 auto;padding:2.2rem 1.5rem 1rem;}
.rankings-wrap .sec-head{margin-bottom:1.6rem;}
.rankings-wrap h2{font-size:clamp(1.45rem,3.4vw,2rem);font-weight:800;letter-spacing:-.01em;}
.rankings-wrap .sec-sub{color:var(--muted);font-size:.92rem;margin-top:.3rem;}
.rank-card{display:flex;gap:1.2rem;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:1.4rem 1.5rem;margin-bottom:1rem;transition:transform .25s cubic-bezier(.17,.67,.24,1),box-shadow .25s,border-color .25s;position:relative;overflow:hidden;}
.rank-card:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(0,0,0,.18);border-color:rgba(139,92,246,0.18);}
.rank-card.champ{border-color:rgba(245,158,11,0.35);}
.rank-card.champ::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#f59e0b,#eab308);}
.rank-no{font-size:2.3rem;font-weight:800;letter-spacing:-.04em;line-height:1;min-width:2.6rem;text-align:right;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;flex-shrink:0;padding-top:.15rem;}
.rank-card.champ .rank-no{background:linear-gradient(135deg,#f59e0b,#eab308);-webkit-background-clip:text;background-clip:text;}
.rank-body{flex:1;min-width:0;}
.rank-head{display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap;margin-bottom:.55rem;}
.rank-team{font-size:1.15rem;font-weight:800;letter-spacing:-.01em;}
.rank-owner{font-size:.8rem;color:var(--muted);font-weight:600;}
.rank-chip{font-size:.7rem;font-weight:700;letter-spacing:.05em;padding:.14rem .5rem;border-radius:6px;background:rgba(139,92,246,0.12);color:var(--accent);white-space:nowrap;}
.rank-blurb{font-size:.96rem;line-height:1.68;color:var(--fg);}
@media(max-width:560px){.rank-card{flex-direction:column;gap:.5rem;}.rank-no{text-align:left;}}

/* --- Item sections (superlatives / receipts) --- */
.items-wrap{max-width:900px;margin:0 auto;padding:2.2rem 1.5rem 1rem;}
.items-wrap h2{font-size:clamp(1.35rem,3vw,1.8rem);font-weight:800;letter-spacing:-.01em;margin-bottom:1.4rem;}
.items-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1rem;}
.item-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:1.15rem 1.3rem;transition:transform .2s,border-color .2s;}
.item-card:hover{transform:translateY(-2px);border-color:rgba(139,92,246,0.2);}
.item-label{font-size:.7rem;text-transform:uppercase;letter-spacing:.09em;color:var(--accent);font-weight:700;margin-bottom:.45rem;}
.item-text{font-size:.92rem;line-height:1.62;}
#sec-receipts .item-card{border-style:dashed;background:rgba(236,72,153,0.025);}
#sec-receipts .item-label{color:var(--accent2);}

/* --- Source notes --- */
.source-notes{max-width:var(--prosew);margin:0 auto;padding:2.5rem 1.5rem 1rem;}
.source-notes h3{font-size:.78rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700;margin-bottom:.6rem;}
.source-notes .sn{font-size:.8rem;color:var(--muted);line-height:1.6;margin-bottom:.4rem;}

/* --- Back to top --- */
.back-top{position:fixed;bottom:1.5rem;left:1.5rem;z-index:90;width:42px;height:42px;border-radius:50%;border:1px solid var(--border);background:rgba(15,17,22,0.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:var(--muted);font-size:1.1rem;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .3s,color .2s,transform .2s;display:grid;place-items:center;}
.back-top.show{opacity:1;pointer-events:auto;}
.back-top:hover{color:var(--fg);transform:translateY(-2px);}
.light .back-top{background:rgba(247,249,252,0.9);}

footer{text-align:center;padding:3rem 1.5rem 2.5rem;color:var(--muted);font-size:.8rem;border-top:1px solid var(--border);margin-top:3rem;}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}
</style>

const EDITION = {"meta":{"season":2025,"type":"preseason","edition":"preseason-2025","title":"Preseason 2025","headline":"Three Champions, Twelve Theories","subtitle":"Nobody here has ever won it twice. Ben goes first.","cutoff_utc":"2025-09-03T23:59:59.000000Z","ranking_source":"content/preseason-2025/preseason_ranking_judgment.json","threads":[{"id":"kittler-repeat","status":"opened","title":"The First Repeat","note":"Ben has played in all three finals and won the last one. Karim and Blake both came back as champion and were gone by the end of December."},{"id":"nate-all-in-2025","status":"opened","title":"Elite Everywhere Else","note":"Nate paid his 2026 first, his 2026 second and Rhamondre Stevenson for the 1.04. If the backfield fails there is nothing premium left to fix it with."},{"id":"thunter-experiment","status":"opened","title":"The Travis Hunter Problem","note":"A player Sleeper lists at both DB and WR, in a league that starts a DB. Nate called 1,400 rookie receiving yards on the eve of the season; Brent called Charles Woodson."},{"id":"kenobi-qb-room","status":"opened","title":"Four Quarterbacks, No Answer","note":"Blake's roster posted the highest season total in the league and still has not solved the position. Richardson lost his job in August."},{"id":"giants-window","status":"opened","title":"The Exit Plan","note":"Zach has already named the condition under which he sells: a bad first five weeks."},{"id":"rice-clock","status":"opened","title":"Six Weeks","note":"Patrick's best receiver is suspended until October after losing 2024 to a knee. What his record looks like when Rice returns is the season."},{"id":"brent-third-time","status":"opened","title":"3rd Times the Charm","note":"Second most productive offense across the fourteen weeks that set the standings, and a 7-7 record to show for it. Eliminated by Blake in consecutive Decembers."},{"id":"noble-conversion","status":"opened","title":"The Noble Conversion","note":"Thirty-six players, seven tight ends, and tenth in scoring across the weeks that counted. Whether Kevin ever trades surplus for a lineup decides his season."},{"id":"chudders-direction","status":"opened","title":"Two Backs and a Prayer","note":"Gibbs and Jeanty will score. The receivers are rookies. Matt has said out loud that he fears finishing in the middle."},{"id":"btj-vs-tet-board-bet","status":"opened","title":"The Burger Position","note":"David passed on Hunter because he did not want two Jaguars, and said Brian Thomas keeps Jacksonville. He has not moved off it since."},{"id":"harlow-paper","status":"opened","title":"The Best Paper in the League","note":"Harlow holds Nate's 2026 first and second. Neither one scores a point in 2025."},{"id":"time-curse","status":"opened","title":"The __TIME Curse","note":"No team name carrying the suffix has ever touched the trophy. Cease-and-desist enforcement continues."}],"source_notes":[{"claim":"Rashee Rice was suspended for the first six games of the 2025 season.","source":"The Washington Post, \"Chiefs wide receiver Rashee Rice is suspended six games\"","url":"https://www.washingtonpost.com/sports/2025/08/27/rashee-rice-suspension/","published":"2025-08-27"},{"claim":"Rashee Rice's 2024 season ended after four games because of a knee injury requiring surgery.","source":"Yahoo Sports, \"Rashee Rice suspension: Fantasy football impact of Chiefs WR being out for first six games of 2025\"","url":"https://sports.yahoo.com/fantasy/article/rashee-rice-suspension-fantasy-football-impact-of-chiefs-wr-being-out-for-first-six-games-of-2025-170337179.html","published":"2025-08-27"},{"claim":"George Pickens was traded from the Steelers to the Cowboys in May 2025.","source":"UPI, \"Dallas Cowboys trade for Pittsburgh Steelers wide receiver George Pickens, draft pick\"","url":"https://www.upi.com/Sports_News/NFL/2025/05/07/Dallas-Cowboys-trade-Pittsburgh-Steelers-George-Pickens/8261746620826/","published":"2025-05-07"},{"claim":"The Cowboys traded Micah Parsons to the Packers on August 28, 2025, for Kenny Clark and two first-round picks.","source":"Packers News, \"Green Bay Packers trade for Dallas Cowboys star Micah Parsons, give up Kenny Clark and 2 first-round picks\"","url":"https://www.packersnews.com/story/sports/nfl/packers/2025/08/28/packers-trade-for-dallas-cowboys-star-micah-parsons/85874212007/","published":"2025-08-28"},{"claim":"The Mavericks traded Luka Doncic to the Lakers in February 2025.","source":"ESPN, \"Luka Doncic to Lakers, Anthony Davis to Mavs in 3-team trade\"","url":"https://www.espn.com/nba/story/_/id/43659380/sources-mavericks-trading-doncic-lakers-anthony-davis","published":"2025-02-02"},{"claim":"The Packers' proposal to ban the tush push failed at the NFL's May 2025 league meeting.","source":"NPR, \"The 'tush push' lives on. NFL teams vote to keep the controversial play\"","url":"https://www.npr.org/2025/05/21/nx-s1-5406206/nfl-tush-push-ban-owners-vote-football","published":"2025-05-21"},{"claim":"Browns rookie Quinshon Judkins was arrested July 12, 2025, in Fort Lauderdale on a misdemeanor domestic violence and battery charge.","source":"ESPN, \"Browns' Quinshon Judkins arrested on domestic violence, battery charge\"","url":"https://www.espn.com/nfl/story/_/id/45727275/browns-quinshon-judkins-arrested-battery-domestic-violence-charge-florida","published":"2025-07-12"},{"claim":"Prosecutors declined to pursue a formal charge against Quinshon Judkins in August 2025.","source":"ESPN, \"Browns' Quinshon Judkins won't face formal battery charge\"","url":"https://www.espn.com/nfl/story/_/id/45980655/browns-quinshon-judkins-face-formal-battery-charge","published":"2025-08-14"},{"claim":"Joe Mixon's foot injury put him on the Texans' reserve non-football injury list to open the season, with Nick Chubb in line to start Week 1.","source":"NBC Sports Pro Football Talk, \"Joe Mixon will open the regular season on the non-football injury list\"","url":"https://www.nbcsports.com/nfl/profootballtalk/rumor-mill/news/joe-mixon-will-open-the-regular-season-on-the-non-football-injury-list","published":"2025-08-25"},{"claim":"The Jaguars ran Travis Hunter at both wide receiver and cornerback through training camp, alternating snaps in team drills.","source":"ESPN, \"Jaguars WR/CB Travis Hunter is impressing at training camp\"","url":"https://www.espn.com/nfl/story/_/id/45900102/jacksonville-jaguars-receiver-travis-hunter-two-way-player-first-two-weeks-training-camp","published":"2025-08-05"},{"claim":"Jordan Addison was suspended for the first three games of the 2025 season under the NFL's substances of abuse policy.","source":"ESPN, \"Vikings WR Jordan Addison suspended 3 games by NFL\"","url":"https://www.espn.com/nfl/story/_/id/45909344/vikings-wr-jordan-addison-suspended-3-games-nfl","published":"2025-08-05"},{"claim":"Miami traded tight end Jonnu Smith to the Pittsburgh Steelers on June 30, 2025.","source":"CBS Sports, \"Jalen Ramsey traded to Steelers, Dolphins receive Minkah Fitzpatrick in blockbuster deal\"","url":"https://www.cbssports.com/nfl/news/jalen-ramsey-traded-to-steelers-dolphins-receive-minkah-fitzpatrick-in-blockbuster-deal","published":"2025-06-30"},{"claim":"Darren Waller came out of retirement on July 1, 2025, and was traded from the Giants to the Dolphins, one day after Miami traded Jonnu Smith.","source":"ESPN, \"Darren Waller unretiring as Dolphins acquire TE in trade\"","url":"https://www.espn.com/nfl/story/_/id/45631064/darren-waller-unretiring-dolphins-acquire-te-trade","published":"2025-07-01"},{"claim":"The Colts named Daniel Jones their starting quarterback over Anthony Richardson on August 19, 2025.","source":"ESPN, \"Colts name Daniel Jones starting QB over Anthony Richardson\"","url":"https://www.espn.com/nfl/story/_/id/46015804/sources-colts-name-daniel-jones-starting-qb-anthony-richardson","published":"2025-08-19"},{"claim":"Ja'Marr Chase entered 2025 as the consensus first overall pick in fantasy drafts.","source":"Sports Illustrated, \"Fantasy Football's Undisputed No. 1 Pick: Ja'Marr Chase\"","url":"https://www.si.com/onsi/fantasy/nfl/fantasy-football-undisputed-no-1-pick-ja-marr-chase","published":"2025-06-16"},{"claim":"Emeka Egbuka drew praise from Buccaneers coaches for his route running in 2025 training camp.","source":"Buccaneers.com, \"Training Camp Takeaways: Emergence of Emeka Egbuka and Tez Johnson, Antoine Winfield Jr. Splash Plays and More\"","url":"https://www.buccaneers.com/news/training-camp-takeaways-emergence-emeka-egbuka-and-tez-johnson-antoine-winfield-jr-splash-plays-more","published":"2025-07-25"},{"claim":"Christian McCaffrey was limited to four games in 2024 by calf/Achilles and PCL injuries.","source":"CBS Sports, \"Christian McCaffrey says he feels 'great' at 49ers minicamp as he returns from injury-plagued 2024 season\"","url":"https://www.cbssports.com/nfl/news/christian-mccaffrey-says-he-feels-great-at-49ers-minicamp-as-he-returns-from-injury-plagued-2024-season/","published":"2025-06-11"},{"claim":"Saquon Barkley rushed for 2,005 yards in 2024.","source":"CBS Sports, \"Saquon Barkley surpasses 2,000 rushing yards: Eagles star becomes ninth RB to reach rare season milestone\"","url":"https://www.cbssports.com/nfl/news/saquon-barkley-surpasses-2000-rushing-yards-eagles-star-becomes-ninth-rb-to-reach-rare-season-milestone/","published":"2024-12-29"},{"claim":"Bijan Robinson entered 2025 drafts as the top-ranked fantasy running back.","source":"Yahoo Sports, \"Bijan Robinson's Fantasy Football Outlook For 2025 NFL Season\"","url":"https://sports.yahoo.com/article/bijan-robinson-fantasy-football-outlook-215435586.html","published":"2025-08-03"},{"claim":"Derrick Henry rushed for 1,921 yards and 16 touchdowns in 2024, his first season in Baltimore, at age 30.","source":"NBC Sports, \"Derrick Henry fantasy football preview 2025: Stats, season outlook, predictions\"","url":"https://www.nbcsports.com/2025-fantasy-football-player-previews/news/derrick-henry-fantasy-football-preview-2025-stats-season-outlook-predictions","published":"2025-08-05"},{"claim":"Ashton Jeanty entered 2025 controlling the Raiders' early-down carries, with Raheem Mostert projected only for third-down work.","source":"NBC Sports, \"Ashton Jeanty fantasy football preview 2025: Stats, season outlook, predictions\"","url":"https://www.nbcsports.com/2025-fantasy-football-player-previews/news/ashton-jeanty-fantasy-football-preview-2025-stats-season-outlook-predictions","published":"2025-08-11"},{"claim":"Travis Kelce's 2024 ended his run of 1,000-yard seasons and left him fifth among tight ends in PPR scoring.","source":"Sports Illustrated, \"Can Chiefs TE Travis Kelce Bounce Back In 2025 Fantasy Football After A Down Year?\"","url":"https://www.si.com/onsi/fantasy/nfl/kansas-city-chiefs-te-travis-kelce-bounce-back-2025-fantasy-football","published":"2025-07-14"},{"claim":"Jaxon Smith-Njigba caught 100 passes for 1,130 yards in 2024 and became Seattle's clear top target for 2025 after DK Metcalf was traded and Tyler Lockett released.","source":"CBS Sports, \"Fantasy Football fallout: D.K. Metcalf requests trade, Seahawks cut Tyler Lockett, Jaxon Smith-Njigba a WR1?\"","url":"https://www.cbssports.com/fantasy/football/news/fantasy-football-fallout-seahawks-to-trade-d-k-metcalf-cut-tyler-lockett-is-jaxon-smith-njigba-a-wr1/","published":"2025-03-06"}]},"sections":[{"id":"cold-open","title":"Season Four","placement":"before_rankings","paragraphs":["Three seasons, three champions, and Ben in all three finals. Karim took the first one off him 154.62 to 95.38. Blake took the second 163.86 to 149.56. Last December he finally got one, 182.28 to 176.58 over Zach, the closest final this league has held. Nobody here has won it twice, and it has not been for lack of chances. Karim came back the next season and was knocked out in December. Blake came back last season and lost twice in December, the semifinal and then the third-place game. Ben walks in third to try it.","What he is defending against no longer resembles itself. Zach starts six receivers who were all first-round picks once and mostly will not be again. David rosters three running backs and four defenses. Nate paid his 2026 first, his 2026 second and Rhamondre Stevenson for one rookie who plays two positions. Matt has Jahmyr Gibbs and Ashton Jeanty and a receiving corps of rookies. Kevin has thirty-six players, seven of them tight ends, and a lineup starts one. Ben has to beat all of that with a roster he barely touched."]},{"id":"draft-diary","title":"Eleven Days in July","placement":"after_rankings","paragraphs":["The league voted to run its first slow draft, twelve hours a pick, and then found out what a twelve-hour clock actually does. It makes waiting worth something. Blake said so out loud while the room complained about his pace: \"I’m def taking every minute. I still have to start my research\". Nobody was persuaded. Matt had been ready since January and burned seven of his twelve hours anyway, having diagnosed himself in April (\"im so over prepped its probably detrimental\") and described his July with total accuracy: \"I'm literally Kevin Costner in Draft Day right now\". Brent narrated the delay live: \"Most anti climatic start to a draft in history\".","Then Patrick took Quinshon Judkins at 1.07 and, a day later, the Browns rookie was arrested in Florida on a misdemeanor domestic-violence battery charge. Waiting stopped being a personality trait. Zach saw it immediately: \"Ooooff. That’s the risk of starting the draft so early\". Blake, on the clock at that exact moment, spoke for everyone still holding a pick: \"Yeah you guys suck for doing this\", and later put the principle plainly: \"Never know when the next story like Judkins will hit the wire\". Nine days of draft were left, and every owner in it had just watched a first-round pick change value overnight.","The man who took it hardest owned none of it. Nate is the league's only Browns fan. \"Unreal. Fucking browns\", he typed, which is the entire history of that franchise, and David offered the only consolation available: \"Least you get a new stadium…\". Patrick, who had spent April launching a law practice handling \"(almost) any legal issue\", waited out the process, and when prosecutors declined the charge in August he drew the distinction his profession requires: \"Thank god my top pick is not a criminal, probably just a huge piece of shit of a guy.\"","The clock collected from everyone else too. Oscar lost the 1.06 outright when a work emergency ran his twelve hours out and the auto-draft took TreVeyon Henderson for him. He filed the most honest scouting report anybody has produced here (\"Wasn’t the guy I would have taken but probably going to be my best player now\") and sentenced himself without a hearing: \"I’ll take it this is my L and disrespectful to the league\". Three picks later Blake, the format's loudest defender, fat-fingered Kaleb Johnson at 1.09, asked for it back, studied the board while the room argued about whether he could have it, and withdrew the request: \"Actually looking at everyone, I’m good\".","The only rule the format could not enforce was the one the league invented itself. Kevin held the compensatory 2.13 that goes to the winner of the losers bracket and made the mistake of naming his target out loud, which is how Matt came to set the protocol in one line: \"okay so we all just dont pick ferguson\". Zach called the ending two days early (\"This is gonna get dicey when someone accidentally autodrafts Ferguson\") and was wrong about a single word. David took Terrance Ferguson on purpose, in the open, without comment. Kevin's alarm was one word (\"Violation!\") and his incident report was better: the culprit \"Sprinted that pick to the podium\". A commissioner then reversed a draft pick by decree, and the league spent a day of its eleven adjudicating the ownership of a tight end who would have been Kevin's seventh.","The draft closed July 21. A day later Brent, who came into the summer with nothing and traded his way into four day-three picks, delivered the only verdict he needed: \"Dang my picks look so good on my team\"."]},{"id":"hunter-hearing","title":"The Travis Hunter Problem","placement":"after_rankings","paragraphs":["This league starts a defensive back, and the defensive back is the cheapest thing in the lineup. Travis Hunter arrived in Jacksonville promising to play both ways and the Jaguars held to it through camp, running him at receiver and at cornerback in the same practices. Sleeper, facing a player without a precedent, listed him at both DB and WR. So a real NFL receiver can be started at the position nobody wants to spend on, and Nate paid the 1.04 to find out what that is worth.","The objections were good. Karim went straight to the invoice: \"You just used a first on a db Nate\". Brent found the only precedent available, and it is the right one: \"Yeah this 6’1 195 lb kid is gonna play both ways in the nfl\", then \"When Charles Woodson couldn’t\". Harlow did the arithmetic in public, because decent defensive backs already produce like second receivers: \"He needs to average 15+ to be better than good DB IDP’s\". And Kevin found the detail that decides it, since tackles are the one defensive category a corner can produce every week: \"He intentionally avoids tackling.\" Interceptions and breakups still pay, and this league gives two points for a breakup, but they arrive in clusters nobody can schedule. Take the tackles away and the receiving line has to carry all of it.","What should worry the eleven teams that passed is who quietly agrees with Nate. Zach crossed over completely (\"I hate to say it but I’m with Nate on this one\"), proposed abolishing the DB slot for next season in the same breath, and admitted he intends to buy the player eventually anyway. Ben, who had already explained the mechanic more clearly than its owner (\"He also doesn’t need to play much on defense to still be classified as a DB.\"), sketched the endgame without raising his voice: \"But we can also always just collude against Nate and get rid of the db spot if it becomes too much of a cheat code\". The reigning champion thinks Nate might be right, and thinks the answer to that is a rule change. Nate's own last word, filed on kickoff eve off a Jaguars post, was less measured: \"OMG THUNTER going for 1400+yds as a rookie WR this year!!!!\""]},{"id":"superlatives","title":"The Offseason Trophy Case","placement":"after_rankings","items":[{"label":"Legal Filing of the Summer","text":"Nate's franchise is MHJTIME, for Marvin Harrison Jr., and he treats the suffix as property. Karim tested it twice. \"Shall I change my team name to #SKATTABOTIME?!?!\" went unpunished in July, so in August he tried #THORTONTIME, after Dont'e Thornton, a rookie on Brent's roster whose Las Vegas camp buzz had become a running joke. That one drew a filing: \"Karim my lawyers are sending over a cease and desist notice to your organization\". Oscar, who practices law for a living, offered to defend him for free. Karim did not need the help. He beat the claim in an afternoon by translating the infringing element into Spanish: \"#THORTONTIEMPO!\""},{"label":"Failed Coup of the Summer","text":"Nate went 3-13 in 2023 and this league has never accepted that it was an accident. Nobody has let it go; mid draft this July, when Nate objected that Brent was table-talking during someone else's pick, the reply skipped the rules entirely: \"Just like there was no rule on you tanking\". That is the man who ran for commissioner. The campaign had a March prequel, when he demanded the draft board be updated because the commissioner \"works for us\", learned Brent was in Berlin on business, and surrendered inside the same conversation: \"I thought the vote passed to draft earlier. And didn't know you were in Berlin. Goodluck with the bizniz!\" In July it came back as a motion: \"Lets all remind ourselves he works for us. I motion to challenge Brent in 2026 for commissioner! I need 2 seconds to put it to a vote. Who wants change?!!\" Kevin voted \"Nay\". Zach filed him under \"#insurrectionist\" and offered a consolation post: \"I’m down to appoint you to some sort of deep state admin role\". The motion died for want of a second."},{"label":"Longest Negotiation","text":"Matt and Kevin closed a Tyler Allgeier deal during round one of the draft, ending a discussion that began sometime in a previous geological era. Matt: \"must be the longest trade negotiation in history\". Kevin: \"Years of foreplay finally culminating\"."}]},{"id":"kickoff-eve","title":"Thursday","placement":"after_rankings","paragraphs":["Two men have carried a title into a new season here and neither kept it. The third spent his summer auditioning kickers. Depending on which of the eleven teams behind him you ask, that is either the most reassuring fact of the preseason or the most alarming one.","On Sunday, in Jacksonville, a rookie is going to line up at wide receiver and then line up at cornerback, and in one lineup in this league he will be sitting in the defensive back slot. Whatever number comes out of that slot is the first real thing anybody learns this year. Everything else on this page is still an argument."]}],"rankings":[{"rank":1,"team_name":"Kittler on the Roof","owner":"Ben","record_2024":"13-3","blurb":"The team that won in December is the team that shows up in September, and that is the whole case. Blake, Zach and Nate all outscored Ben across 2024. Ben beat two of them in the bracket anyway, handling Nate by twenty one and then holding off Zach by 5.70. He answered it by doing almost nothing. Joe Burrow throws to Puka Nacua and Garrett Wilson with Jonathan Taylor behind them, and the only structural work of the summer was stacking Tucker Kraft, Elijah Arroyo and Thomas Fidone behind George Kittle, the one starter here with an expiration date anybody can see. He carries five running backs, fewer than any other contender, because he does not need a sixth. The loudest thing he did all offseason was cycle through four kickers before settling on Matt Gay. He drafts the minute his turn arrives (\"I’m ready to go whenever I’m up. So send me trade offers quick if you’re thinking about it.\"), he posts almost nothing, and the one time he spoke at length he produced the most careful sentence anybody wrote about Travis Hunter: \"I think there’s a pretty decent chance he’s able to put up wr2 numbers out of a DB spot for a couple years, but one way or another that won’t be something that happens long into his career.\" He also roots against Dallas the way Packers fans do. When Green Bay's proposal to ban the tush push, the play Zach's quarterback is built on, died in May, Ben filed a mock disclosure: \"My attempt, as part owner of the packers, to sabotage Zach’s team sadly failed.\" He did not need the help. Dallas sent Luka Doncic to Los Angeles in February, and on August 28 mishandled the Micah Parsons standoff so completely that the best pass rusher alive became a Packer. Zach sent him the news. Ben's reply: \"First Luka and now this. Dallas has been very good to me this year.\" The one thing this roster has never done is defend anything, and neither has anybody else here."},{"rank":2,"team_name":"MHJTIME","owner":"Nate","record_2024":"12-5","blurb":"Nothing in this league scores like the top of Nate's lineup. Ja'Marr Chase went into 2025 as the consensus first pick in fantasy drafts, Malik Nabers and Marvin Harrison line up beside him, Jayden Daniels runs it and Trey McBride plays tight end. That is the highest ceiling anybody here can field, and it came with a bill: the 1.04 that became Travis Hunter cost his 2026 first, his 2026 second and Rhamondre Stevenson. Harlow holds the picks, so if this roster needs repairing there is nothing premium left to do it with. Behind that lineup are nine running backs and no certainty. Chuba Hubbard is the starter, bought from Zach mid-draft, and Zach's review in August ran three words: \"Your backfield is trash\". Nate's answer became the motto, in two messages: \"I just need avg rb play.\" then \"Elite everywhere else.\" The second half is true. The first half is the season. He spent August auditioning, dropping Chris Rodriguez and buying him back and announcing him as the solution (\"Chris Rodriguez is the guy. Rb1 for the commies. I might have saved my ass.\"), which drew the only review that mattered, from Brent: \"Nate you are like a paper in the wind my man\". Two days later Washington traded Brian Robinson, whom Nate already owned, to San Francisco, and the case moved to him. On kickoff eve Nate went back to Blake and traded for Jerome Ford. Four answers in three weeks at one position, from the one owner who cannot go buy a real one, because the teams with running backs to sell are the teams chasing him. He put the rest on the record in March, deep in an NBA argument and feeling untouchable: \"do yall understand im about to win a Jailyard fantasy football championship in 2025?\" He may lead this league in scoring and still lose in the first week of December to a hamstring."},{"rank":3,"team_name":"General Ken-obi","owner":"Blake","record_2024":"11-6","blurb":"Blake's roster posted the highest season total in the league last year, 2,628.96, and got a third seed and two December losses out of it, the semifinal to Zach and then the third-place game to Nate, by a combined 17.70 points. The skill positions are not the problem. CeeDee Lamb, Nico Collins, Drake London, Chris Olave, Jameson Williams and DJ Moore would start anywhere in this league, and Saquon Barkley, coming off 2,005 rushing yards, sits in front of Kenneth Walker and Chase Brown. The quarterbacks are. Drake Maye, J.J. McCarthy, Trevor Lawrence and Anthony Richardson are four unproven answers to the one question every team above him has settled, and August removed one of them when Indianapolis handed the job to Daniel Jones. The man who made the bet buried it himself: \"The Anthony Richardson gamble was a bust\". Read it as a tell. Blake never calls his shots; he talks his own guys down in public all year and finishes in the money anyway, and the last message of the entire offseason was him doing it again about one of his own quarterbacks: \"As a TLaw owner, I’m very skeptical\". What he has not done is fix it. He rosters eight running backs and ten receivers in a league where four teams are drowning in backs and two of them need receiving help, and none of that has become a quarterback he trusts. Third is where the deepest collection of skill players in the league sits while the position that decides games stays a coin flip."},{"rank":4,"team_name":"Sleeping Giants","owner":"Zach","record_2024":"11-5","blurb":"Zach lost the title game by 5.70 and ran the same team back. No team scored more per game than his last season, and it starts with Derrick Henry, Josh Jacobs and Kyren Williams, three backs who carry their offenses, with Jalen Hurts in front of them. The receivers are where the arithmetic gets uncomfortable. Cooper Kupp, Mike Evans, Stefon Diggs, Keenan Allen, DeAndre Hopkins and Amari Cooper were all first-round fantasy picks once, Jordan Addison is suspended three games, and Zach keeps thirteen receivers because he still believes in the ones left. How he operates shows up best at tight end. Miami traded Jonnu Smith to Pittsburgh at the end of June, which cost Zach his starter, and he took it philosophically: \"There’s no such thing as a secure TE\". The next day Darren Waller came out of retirement and was traded to Miami to replace Jonnu. Zach claimed him off waivers within hours and inside a week was selling him as literature: \"He was in a dark place after the injury and divorce man. This is his second coming\". He replaced his own tight end with the man hired to replace his own tight end, and then marketed the replacement as a resurrection. What separates him from the other contenders is that he has already published his exit. In late August he hung a sign on the roster (\"I’ve got league winner RBs\") and named the trigger: \"If things go south first 5 weeks for me record wise, someone can solidify their run to the chip\". Put the actuarial case to him and he does not dispute it, he answers with the thesis: \"Henrys gonna go til he’s 40 tho and Kyrens only 24\". Henry ran for 1,921 yards and 16 touchdowns at 30 last season, which is not what is supposed to happen. If it happens again Zach wins the title he lost by six points. If it does not, he is the most important seller in the league by Halloween and somebody else buys a championship off him."},{"rank":5,"team_name":"Rasheeing the Scene","owner":"Patrick","record_2024":"10-6","blurb":"7-10, then 8-8, then 10-6. Patrick and the champion are the only two owners here who have improved in each of the last three seasons, and Patrick has done it without ever raising his voice. Josh Allen is the most valuable asset anybody in this league owns. Behind him are ten running backs, which elsewhere on this page is a symptom and here is not, because De'Von Achane, Bucky Irving, Travis Etienne, Trey Benson and Quinshon Judkins will all start NFL games this year. He reads that position better than he reads anything. On August 22, while the second-ranked team was chasing Washington's backfield in circles, Patrick called the whole shuffle in two lines and already owned the right side of it: \"Ekler and baby Commanders rbs\". His problem is the position his franchise is named after. Rashee Rice lost 2024 to a knee injury after four games, and on August 27 the NFL suspended him for the first six of 2025, so Patrick's best receiver will have played about a quarter of a season across two years by the time he is back. His response was the driest thing anybody typed all summer: \"omg Rashee Rice was suspended no way I had no idea that was possible I am 100% shocked\". Until October it is Michael Pittman, bought out of Matt's teardown for a third-round pick, plus Keon Coleman, Josh Downs and Jauan Jennings, and that group has to keep him alive. He sits a spot above Brent because their problems expire on different schedules. Brent needs two years of young players to mature. Patrick needs to still be in the race in week seven."},{"rank":6,"team_name":"The Boonist Monks","owner":"Brent","record_2024":"7-9","blurb":"Across the fourteen weeks that set the standings, Brent's offense was the second most productive in the league. He went 7-7 in them, scraped into the bracket, and was gone in a week, beaten by Blake by 4.18 points for the second December running. He has been on the record about the sequel since March: \"3rd times the charm\". The reputation is that the roster is old and the famous names carry it. Travis Kelce's 2024 ended his run of thousand-yard seasons and left him fifth among tight ends, still a starter and pointed one way. Alvin Kamara, Tyreek Hill, Nick Chubb and Adam Thielen fill out the impression. Nate has been saying it for two years, and for two years Brent has answered the same way: \"It gets younger every year\". He is closer to right than the joke allows. Jaxon Smith-Njigba caught 100 passes last season and then inherited the whole Seattle target share when DK Metcalf was traded and Tyler Lockett released. Zay Flowers and James Cook are ascending starters. Lamar Jackson is the best quarterback on any roster in this league. And Terry McLaurin's holdout ended in late August, which Zach flagged the same day as a \"Big day for @Brent Boone\". The live argument is Chubb. Houston put Joe Mixon on the non-football injury list and named Chubb the week one starter, and Nate, who had tried to buy Chubb in July out of affection (\"because I love him. my favorite brown of all time. and hes good value\") and been refused, spent kickoff eve declaring him finished. Brent answered with pure incredulity, which is how he argues when he is confident: \"Sure buddy. That’s why he got named starter. Because nfl teams with championship aspirations start vets with bad knees over young talent\". His philosophy arrived the same night in two consecutive messages: \"The future is fucked bro\" and \"Live for the now!\" He needs one more year of the young half arriving faster than the old half leaves."},{"rank":7,"team_name":"The Legion of Bouz","owner":"Karim","record_2024":"7-9","blurb":"Everything here rides on one man's health. Christian McCaffrey played four games in 2024. When he is upright, a lineup with Amon-Ra St. Brown, DeVonta Smith, Jaylen Waddle and Patrick Mahomes looks like a contender, and it is worth knowing where the best of those came from: Karim bought Amon-Ra off Oscar's rebuild for the picks Oscar then spent on running backs, one trade that shaped both ends of this list. When McCaffrey is not upright, the cover is an aging Aaron Jones and a Joe Mixon already on the shelf, and the season ends by Halloween. So Karim bought the entire New York Giants backfield. He had Tyrone Tracy; in July he went and got Cam Skattebo, which is why his one public prediction of the summer covers both of them: \"Tracy and Skatt finish as RB2s in 2025. First hot take!\" Owning both halves of a committee is the only honest way to bet on one. Acquiring Skattebo required reversing himself in public, which is what makes it funny. Nate, mid draft, told Karim he was targeting Skattebo so the two of them would not collide, and Karim said he had no interest. Karim then used back-to-back picks on Cam Ward and Cam Skattebo. Nate called him a jabroni for it; Karim contested nothing (\"Haha this is all true\"), produced the only defense required (\"But we agreed to give everyone 12 hrs to pick\"), and then volunteered the motive unprompted: \"It’s cos I been watch Skattabo highlights all day\". He also plays this league from the United Kingdom, and July was a running demonstration of what that costs: picks expiring while he slept (\"Just woke up\"), two Kevin trades that turned into commissioner business, and Oscar's summary of a typical Karim day, \"You had back to back picks and then picked the guy highest ranked in the system hours later and trade fuck up after lol\". There is a title in this roster and a top-four pick in it, and almost nothing in between."},{"rank":8,"team_name":"Noble FFT","owner":"Kevin","record_2024":"5-12","blurb":"The names say contender. Bijan Robinson went into 2025 drafts as the top-ranked fantasy back, Breece Hall is behind him, A.J. Brown and Tee Higgins are outside, Tyler Warren is at tight end, Caleb Williams is at quarterback, and Micah Parsons, who just cost Green Bay two first-round picks in real football, plays defense for him. The scoring says otherwise. Across the fourteen weeks that decided last season's standings Kevin finished tenth in the league in points, and went 2-12 in them. The season total that looks respectable only looks that way because he played three extra games in the consolation bracket. Something between the roster and the lineup is eating the difference, and it is visible on the roster sheet: thirty-six players, the most in the league and six more than the smallest, seven of them tight ends and twelve of them receivers, plus two kickers. A lineup starts one tight end. Kevin acquires constantly and parts with nothing, which is why a commissioner had to intervene in July over what would have been his seventh, and why he described the draft in the language of an appetite: \"All this deal making has me calling people for real world business deals just to get my fix lol\". Brent's version of him mid-draft was better: \"He’s been snorting hot sauce and watching film\", to which Kevin pled guilty on the spot: \"Scouting department of Noble FFT never sleeps\". Nobody here is better at finding a good player and nobody is worse at deciding which good players he does not need. Harlow has a version of the same problem three spots lower with worse inventory; the difference is that contenders will trade for tight ends and receivers in October, which puts Kevin one phone call from a bracket he has never reached."},{"rank":9,"team_name":"Chudders Football Team","owner":"Matt","record_2024":"6-11","blurb":"Gibbs and Jeanty will score points. Jahmyr Gibbs is the kind of back most rebuilds never get to keep, and Ashton Jeanty walked into a Las Vegas backfield he controlled on early downs from the day he arrived, which is why Matt has been happy since April: \"Very very very happy about Jeanty at the raiders.\" The receivers will not. Emeka Egbuka, whose route running had Tampa Bay's coaches talking by late July, is the best of a group that is otherwise rookies and dart throws, with Colston Loveland arriving into an offense Oscar handicapped correctly on draft night: \"Loveland will be good, he’s just like 1 of 5 first rounders catching passes in that offense.\" Justin Herbert is the only man on the roster with a resume, and Matt has finished dead last in scoring in two of the last three seasons. Brent put the disagreement to him in August, and inside this league it is a live disagreement with real money behind it: can you \"actually build a championship team around two young running backs drafted at the front end of your rebuild\"? Four of the first seven picks in July were running backs, so three of Brent's rivals took the same side of it in the same twelve hours. The sharper worry is the one Matt raised himself, hours after the draft closed. He is not afraid of being bad. He is afraid of being adequate: \"I’m mildly concerned I’ll be midling enough to not be at the top next year. I think I need another year of high picks\", then \"Or perhaps be stuck in mediocrity\". Winning seven games in 2025 may be the worst thing available to him."},{"rank":10,"team_name":"Father Time ","owner":"David","record_2024":"7-9","blurb":"David has the best young receivers in the league and cannot build a lineup around them. Brian Thomas, Ladd McConkey, Rome Odunze and Tetairoa McMillan are four players any team here would take. Behind them are three running backs, the fewest in the league by a distance, plus five quarterbacks and four team defenses on a roster that starts one of each. Everyone treats him as the league's ghost and they have it backwards; he posts less than anyone and wastes nothing when he does. Holding 1.03 on draft night with Travis Hunter on the board and the whole league about to spend two months arguing about him, David took McMillan and gave two reasons. He did not want two Jaguars: \"Fair, I dont want two jags is why i passes\". And he liked McMillan's size against Carolina's quarterback: \"All fair, I just liked the size difference between Tet and Young. Gonna be hard to over throw someone that big\". Then he announced it in one line (\"Burgers have been cooked and finished\") and never revisited it. The surname is Hamburger and the league shortened it to Burger years ago, which is the only reason a team called Father Time rosters the youngest receivers in football. Zach saw the plan (\"Burgers got the blueprint quietly over there. Stacking young wideouts for 2-3 years\") and Brent named it: \"Burger is wide receiver island\". The island has no bridge. The quarterbacks and defenses are exactly what a team with three running backs should be trading, and Patrick spent the summer trying (\"I’m trying to trade him RBs for some of those WRs right now, but dude is MIA\") while Nate offered a 2027 first for Shedeur Sanders and got silence. On the eve of the season, with the league telling him Hunter changes Jacksonville, David restated his position without moving: \"Tet all day\". He may be right about all of it. None of it scores a point in 2025."},{"rank":11,"team_name":"Burden of Etienne-y Woody","owner":"Harlow","record_2024":"6-10","blurb":"Justin Jefferson is a genuine cornerstone, and George Pickens moved to Dallas in May, which could give Harlow two brand-name receivers before Luther Burden catches a pass. Everything behind them is a committee. He rosters eleven running backs, more than anyone in the league, and almost none of them will start a week that matters. That is the lineup he takes into 2025 and that is why he is eleventh. The reason to watch him anyway is the trade. Nate needed the 1.04 in March, Harlow owned it, and he sold it for Nate's 2026 first and second with Rhamondre Stevenson attached, then explained it like a man who had modeled it: \"Mondre was a throw in, next years 1st was the cornerstone for me\". Kevin scored it the same night: \"Congrats Harlow, you’ve won the trade\". It is not the free money the league keeps calling it. If Hunter becomes what Nate says and the push lands, those picks convey late and Harlow will have sold the best player in the deal. What he bought is asymmetry, and the worse the next two years go for the loudest team in the league the more his paper is worth. What none of it does is score a point this season. He also evaluates players better than anyone here, which is worth saying only because his record hides it: he did the math on Hunter while everyone else traded opinions, he scouted Devin Neal off tape (\"He was by far the best player on that KU team\"), and he spent a sixth-round pick on Will Howard as a cheap swing at a starting job. On the last day of the draft he suggested somebody go back and grade the league's old drafts in hindsight, then volunteered for it: \"Would be fun to have written draft recaps, look backs, and grades like 2-3 years later\". He wants receipts kept on everybody, which is a comfortable thing to want when you are holding a rival's first-round pick."},{"rank":12,"team_name":"Ghastly Grayskull Gang","owner":"Oscar","record_2024":"3-13","blurb":"Oscar went 3-13, finished eleventh in scoring, and turned his roster into a running back exchange. He had already sold Amon-Ra St. Brown to Karim (\"For the record I got two first rd picks and Tank Bigsby for Amon Ra\"), and he spent that capital on Omarion Hampton at 1.02 and TreVeyon Henderson at 1.06, the second of those without being at the keyboard. His own summary was accurate and slightly stunned: \"Just like that I became a running back team\". Ten backs now, and no lineup in football starts more than three. Ten works for Patrick seven spots up because Patrick's ten include five men who will start NFL games. Oscar's are mostly waiting on somebody else's job to open, and waiting is not a season. The talent is real and it is arriving faster here than anywhere else: Brock Bowers is one of the best young players in this league at any position, DK Metcalf and Xavier Worthy have ceilings, and the picks keep coming. What Oscar has that nobody else does is sight. He handicapped Loveland's target competition correctly on draft night, he volunteered to defend Karim from a cease-and-desist for free, and when Nate spent a morning needling Brent, Oscar produced the only scouting report that feud has ever needed: \"Damn Kamara selling real estate in NOLA while Boone lives rent free in Nate’s head\". He sees everyone clearly except his own clock. Twelfth is arithmetic, and the way out is a trade with one of the three teams sitting on the same problem."}]};

(function(){
  const m = EDITION.meta;
  document.getElementById('heroHeadline').textContent = m.headline;
  document.getElementById('heroSub').textContent = m.subtitle;

  const main = document.getElementById('editionMain');

  function el(tag, cls, text){
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }

  function proseSection(sec){
    const wrap = el('section', 'prose-sec reveal');
    wrap.id = 'sec-' + sec.id;
    wrap.appendChild(el('h2', null, sec.title));
    (sec.paragraphs || []).forEach(p => wrap.appendChild(el('p', null, p)));
    return wrap;
  }

  function itemsSection(sec){
    const wrap = el('section', 'items-wrap reveal');
    wrap.id = 'sec-' + sec.id;
    wrap.appendChild(el('h2', null, sec.title));
    const grid = el('div', 'items-grid');
    (sec.items || []).forEach(it => {
      const card = el('div', 'item-card');
      card.appendChild(el('div', 'item-label', it.label));
      card.appendChild(el('div', 'item-text', it.text));
      grid.appendChild(card);
    });
    wrap.appendChild(grid);
    return wrap;
  }

  function renderSection(sec){
    return sec.items ? itemsSection(sec) : proseSection(sec);
  }

  function rankingsSection(){
    const wrap = el('section', 'rankings-wrap');
    wrap.id = 'sec-rankings';
    const head = el('div', 'sec-head reveal');
    head.appendChild(el('h2', null, 'The Preseason Power Rankings'));
    head.appendChild(el('div', 'sec-sub', 'Ranked by what each roster is betting on, and how likely it is to work.'));
    wrap.appendChild(head);
    EDITION.rankings.slice().sort((a,b)=>a.rank-b.rank).forEach(r => {
      const card = el('article', 'rank-card reveal' + (r.rank === 1 ? ' champ' : ''));
      card.appendChild(el('div', 'rank-no', String(r.rank)));
      const body = el('div', 'rank-body');
      const head = el('div', 'rank-head');
      head.appendChild(el('span', 'rank-team', r.team_name.trim()));
      head.appendChild(el('span', 'rank-owner', r.owner));
      head.appendChild(el('span', 'rank-chip', '2024: ' + r.record_2024));
      body.appendChild(head);
      body.appendChild(el('p', 'rank-blurb', r.blurb));
      card.appendChild(body);
      wrap.appendChild(card);
    });
    return wrap;
  }

  const before = EDITION.sections.filter(s => s.placement === 'before_rankings');
  const after = EDITION.sections.filter(s => s.placement !== 'before_rankings');
  before.forEach(s => main.appendChild(renderSection(s)));
  main.appendChild(rankingsSection());
  after.forEach(s => main.appendChild(renderSection(s)));

  // Source notes
  const notes = (m.source_notes || []);
  if (notes.length){
    const box = document.getElementById('sourceNotes');
    const list = document.getElementById('sourceNotesList');
    notes.forEach(n => {
      const d = el('div', 'sn');
      d.appendChild(document.createTextNode(n.claim + ' '));
      const a = el('a', null, n.source);
      a.href = n.url; a.rel = 'noopener'; a.target = '_blank';
      d.appendChild(a);
      d.appendChild(document.createTextNode(' (published ' + n.published + ').'));
      list.appendChild(d);
    });
    box.hidden = false;
  }

  // Reveal on scroll
  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => { if (e.isIntersecting){ e.target.classList.add('vis'); io.unobserve(e.target); } });
  }, { threshold: 0.06 });
  document.querySelectorAll('.reveal').forEach(n => io.observe(n));

  // Scroll progress + back to top
  const bar = document.getElementById('scrollProgress');
  const backTop = document.getElementById('backTop');
  window.addEventListener('scroll', () => {
    const h = document.documentElement.scrollHeight - window.innerHeight;
    bar.style.width = h > 0 ? (window.scrollY / h * 100) + '%' : '0%';
    backTop.classList.toggle('show', window.scrollY > 600);
  }, {passive:true});
  backTop.addEventListener('click', () => window.scrollTo({top:0, behavior:'smooth'}));

  applyConfig();
})();
</script>
</body>
</html>
