<style>
:root{
  --bg:#0b0d10;--fg:#e8ecf0;--muted:#7a8194;
  --accent:#8b5cf6;--accent2:#ec4899;
  --good:#16a34a;--bad:#dc2626;--warn:#ca8a04;
  --card:rgba(255,255,255,0.03);--glass:rgba(255,255,255,0.05);
  --border:rgba(255,255,255,0.07);
  --font:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --maxw:1200px;--prosew:760px;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--fg);font-family:var(--font);overflow-x:hidden;line-height:1.5;}
a{color:var(--accent2);text-decoration:none;}
a:hover{text-decoration:underline;}
.light{--bg:#f7f9fc;--fg:#111418;--muted:#5f6672;--card:rgba(0,0,0,0.03);--glass:rgba(0,0,0,0.04);--border:rgba(0,0,0,0.08);color-scheme:light;}
@view-transition{navigation:auto;}::view-transition-old(root){animation:vt-out .2s ease-in;}::view-transition-new(root){animation:vt-in .3s ease-out;}@keyframes vt-out{to{opacity:0;filter:blur(2px);}}@keyframes vt-in{from{opacity:0;filter:blur(2px);}}
.scroll-progress{position:fixed;top:0;left:0;height:3px;z-index:200;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0%;transition:width .1s linear;pointer-events:none;}
.reveal{opacity:0;transform:translateY(20px);transition:opacity .5s cubic-bezier(.17,.67,.24,1),transform .5s cubic-bezier(.17,.67,.24,1);}
.reveal.vis{opacity:1;transform:none;}

/* --- Hero --- */
.hero{max-width:var(--prosew);margin:0 auto;padding:4.5rem 1.5rem 2.5rem;text-align:center;}
.hero .kicker{font-size:.78rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:1rem;}
.hero h1{font-size:clamp(1.9rem,5.5vw,3.1rem);font-weight:800;letter-spacing:-.02em;line-height:1.12;margin-bottom:1rem;background:linear-gradient(135deg,var(--fg) 55%,var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;}
.hero .sub{color:var(--muted);font-size:1rem;max-width:560px;margin:0 auto 1.4rem;}
.hero .rule{width:64px;height:3px;margin:0 auto;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent2));}

/* --- Prose sections --- */
.prose-sec{max-width:var(--prosew);margin:0 auto;padding:2.2rem 1.5rem 1rem;}
.prose-sec h2{font-size:clamp(1.35rem,3vw,1.8rem);font-weight:800;letter-spacing:-.01em;margin-bottom:1.1rem;}
.prose-sec h2 .idx{color:var(--accent);margin-right:.55rem;font-weight:800;}
.prose-sec p{font-size:1.02rem;line-height:1.72;color:var(--fg);margin-bottom:1.15rem;}
.prose-sec p:last-child{margin-bottom:0;}
#sec-cold-open p:first-of-type::first-letter{font-size:3.1em;font-weight:800;float:left;line-height:.85;padding:.06em .12em 0 0;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;}
#sec-kickoff-eve p:last-of-type{font-weight:600;}

/* --- Rankings --- */
.rankings-wrap{max-width:900px;margin:0 auto;padding:2.2rem 1.5rem 1rem;}
.rankings-wrap .sec-head{margin-bottom:1.6rem;}
.rankings-wrap h2{font-size:clamp(1.45rem,3.4vw,2rem);font-weight:800;letter-spacing:-.01em;}
.rankings-wrap .sec-sub{color:var(--muted);font-size:.92rem;margin-top:.3rem;}
.rank-card{display:flex;gap:1.2rem;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:1.4rem 1.5rem;margin-bottom:1rem;transition:transform .25s cubic-bezier(.17,.67,.24,1),box-shadow .25s,border-color .25s;position:relative;overflow:hidden;}
.rank-card:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(0,0,0,.18);border-color:rgba(139,92,246,0.18);}
.rank-card.champ{border-color:rgba(245,158,11,0.35);}
.rank-card.champ::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#f59e0b,#eab308);}
.rank-no{font-size:2.3rem;font-weight:800;letter-spacing:-.04em;line-height:1;min-width:2.6rem;text-align:right;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;flex-shrink:0;padding-top:.15rem;}
.rank-card.champ .rank-no{background:linear-gradient(135deg,#f59e0b,#eab308);-webkit-background-clip:text;background-clip:text;}
.rank-body{flex:1;min-width:0;}
.rank-head{display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap;margin-bottom:.55rem;}
.rank-team{font-size:1.15rem;font-weight:800;letter-spacing:-.01em;}
.rank-owner{font-size:.8rem;color:var(--muted);font-weight:600;}
.rank-chip{font-size:.7rem;font-weight:700;letter-spacing:.05em;padding:.14rem .5rem;border-radius:6px;background:rgba(139,92,246,0.12);color:var(--accent);white-space:nowrap;}
.rank-blurb{font-size:.96rem;line-height:1.68;color:var(--fg);}
.rank-blurb + .rank-blurb{margin-top:.85em;}
@media(max-width:560px){.rank-card{flex-direction:column;gap:.5rem;}.rank-no{text-align:left;}}

/* --- Item sections (superlatives / receipts) --- */
.items-wrap{max-width:900px;margin:0 auto;padding:2.2rem 1.5rem 1rem;}
.items-wrap h2{font-size:clamp(1.35rem,3vw,1.8rem);font-weight:800;letter-spacing:-.01em;margin-bottom:1.4rem;}
.items-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1rem;}
.item-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:1.15rem 1.3rem;transition:transform .2s,border-color .2s;}
.item-card:hover{transform:translateY(-2px);border-color:rgba(139,92,246,0.2);}
.item-label{font-size:.7rem;text-transform:uppercase;letter-spacing:.09em;color:var(--accent);font-weight:700;margin-bottom:.45rem;}
.item-text{font-size:.92rem;line-height:1.62;}
#sec-receipts .item-card{border-style:dashed;background:rgba(236,72,153,0.025);}
#sec-receipts .item-label{color:var(--accent2);}

/* --- Source notes --- */
.source-notes{max-width:var(--prosew);margin:0 auto;padding:2.5rem 1.5rem 1rem;}
.source-notes h3{font-size:.78rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700;margin-bottom:.6rem;}
.source-notes .sn{font-size:.8rem;color:var(--muted);line-height:1.6;margin-bottom:.4rem;}

/* --- Back to top --- */
.back-top{position:fixed;bottom:1.5rem;left:1.5rem;z-index:90;width:42px;height:42px;border-radius:50%;border:1px solid var(--border);background:rgba(15,17,22,0.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:var(--muted);font-size:1.1rem;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .3s,color .2s,transform .2s;display:grid;place-items:center;}
.back-top.show{opacity:1;pointer-events:auto;}
.back-top:hover{color:var(--fg);transform:translateY(-2px);}
.light .back-top{background:rgba(247,249,252,0.9);}

footer{text-align:center;padding:3rem 1.5rem 2.5rem;color:var(--muted);font-size:.8rem;border-top:1px solid var(--border);margin-top:3rem;}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}
</style>

const EDITION = {"meta":{"season":2025,"type":"preseason","edition":"preseason-2025","title":"Preseason 2025","headline":"Three Champions, Twelve Theories","subtitle":"Nobody here has ever won it twice. Ben is the third to try.","cutoff_utc":"2025-09-03T23:59:59.000000Z","ranking_source":"content/preseason-2025/preseason_ranking_judgment.json","threads":[{"id":"kittler-repeat","status":"opened","title":"The First Repeat","note":"Ben has played in all three finals and won the last one. Karim and Blake both came back as champion and were gone by the end of December."},{"id":"nate-all-in-2025","status":"opened","title":"Elite Everywhere Else","note":"Nate paid his 2026 first, his 2026 second and Rhamondre Stevenson for the 1.04. If the backfield fails there is nothing premium left to fix it with."},{"id":"thunter-experiment","status":"opened","title":"The Travis Hunter Problem","note":"A player Sleeper lists at both DB and WR, in a league that starts a DB. Nate called 1,400 rookie receiving yards on the eve of the season; Brent called Charles Woodson."},{"id":"kenobi-qb-room","status":"opened","title":"Four Quarterbacks, No Answer","note":"Blake's roster posted the highest season total in the league and still has not solved the position. Richardson lost his job in August."},{"id":"giants-window","status":"opened","title":"The Exit Plan","note":"Zach has already named the condition under which he sells: a bad first five weeks."},{"id":"rice-clock","status":"opened","title":"Six Weeks","note":"Patrick's best receiver is suspended until October after losing 2024 to a knee. What his record looks like when Rice returns is the season."},{"id":"brent-third-time","status":"opened","title":"3rd Times the Charm","note":"Second most productive offense across the fourteen weeks that set the standings, and a 7-7 record to show for it. Eliminated by Blake in consecutive Decembers."},{"id":"noble-conversion","status":"opened","title":"The Noble Conversion","note":"Thirty-six players, seven tight ends, and tenth in scoring across the weeks that counted. Whether Kevin ever trades surplus for a lineup decides his season."},{"id":"chudders-direction","status":"opened","title":"Two Backs and a Prayer","note":"Gibbs and Jeanty will score. The receivers are rookies. Matt has said out loud that he fears finishing in the middle."},{"id":"btj-vs-tet-board-bet","status":"opened","title":"The Burger Position","note":"David passed on Hunter because he did not want two Jaguars, and said Brian Thomas keeps Jacksonville. He has not moved off it since."},{"id":"harlow-paper","status":"opened","title":"The Best Paper in the League","note":"Harlow holds Nate's 2026 first and second. Neither one scores a point in 2025."},{"id":"time-curse","status":"opened","title":"The __TIME Curse","note":"No team name carrying the suffix has ever touched the trophy. Cease-and-desist enforcement continues."}],"source_notes":[{"claim":"Rashee Rice was suspended for the first six games of the 2025 season.","source":"The Washington Post, \"Chiefs wide receiver Rashee Rice is suspended six games\"","url":"https://www.washingtonpost.com/sports/2025/08/27/rashee-rice-suspension/","published":"2025-08-27"},{"claim":"Rashee Rice's 2024 season ended after four games because of a knee injury requiring surgery.","source":"Yahoo Sports, \"Rashee Rice suspension: Fantasy football impact of Chiefs WR being out for first six games of 2025\"","url":"https://sports.yahoo.com/fantasy/article/rashee-rice-suspension-fantasy-football-impact-of-chiefs-wr-being-out-for-first-six-games-of-2025-170337179.html","published":"2025-08-27"},{"claim":"George Pickens was traded from the Steelers to the Cowboys in May 2025.","source":"UPI, \"Dallas Cowboys trade for Pittsburgh Steelers wide receiver George Pickens, draft pick\"","url":"https://www.upi.com/Sports_News/NFL/2025/05/07/Dallas-Cowboys-trade-Pittsburgh-Steelers-George-Pickens/8261746620826/","published":"2025-05-07"},{"claim":"The Cowboys traded Micah Parsons to the Packers on August 28, 2025, for Kenny Clark and two first-round picks.","source":"Packers News, \"Green Bay Packers trade for Dallas Cowboys star Micah Parsons, give up Kenny Clark and 2 first-round picks\"","url":"https://www.packersnews.com/story/sports/nfl/packers/2025/08/28/packers-trade-for-dallas-cowboys-star-micah-parsons/85874212007/","published":"2025-08-28"},{"claim":"The Mavericks traded Luka Doncic to the Lakers in February 2025.","source":"ESPN, \"Luka Doncic to Lakers, Anthony Davis to Mavs in 3-team trade\"","url":"https://www.espn.com/nba/story/_/id/43659380/sources-mavericks-trading-doncic-lakers-anthony-davis","published":"2025-02-02"},{"claim":"The Packers' proposal to ban the tush push failed at the NFL's May 2025 league meeting.","source":"NPR, \"The 'tush push' lives on. NFL teams vote to keep the controversial play\"","url":"https://www.npr.org/2025/05/21/nx-s1-5406206/nfl-tush-push-ban-owners-vote-football","published":"2025-05-21"},{"claim":"Browns rookie Quinshon Judkins was arrested July 12, 2025, in Fort Lauderdale on a misdemeanor domestic violence and battery charge.","source":"ESPN, \"Browns' Quinshon Judkins arrested on domestic violence, battery charge\"","url":"https://www.espn.com/nfl/story/_/id/45727275/browns-quinshon-judkins-arrested-battery-domestic-violence-charge-florida","published":"2025-07-12"},{"claim":"Prosecutors declined to pursue a formal charge against Quinshon Judkins in August 2025.","source":"ESPN, \"Browns' Quinshon Judkins won't face formal battery charge\"","url":"https://www.espn.com/nfl/story/_/id/45980655/browns-quinshon-judkins-face-formal-battery-charge","published":"2025-08-14"},{"claim":"Joe Mixon's foot injury put him on the Texans' reserve non-football injury list to open the season, with Nick Chubb in line to start Week 1.","source":"NBC Sports Pro Football Talk, \"Joe Mixon will open the regular season on the non-football injury list\"","url":"https://www.nbcsports.com/nfl/profootballtalk/rumor-mill/news/joe-mixon-will-open-the-regular-season-on-the-non-football-injury-list","published":"2025-08-25"},{"claim":"The Jaguars ran Travis Hunter at both wide receiver and cornerback through training camp, alternating snaps in team drills.","source":"ESPN, \"Jaguars WR/CB Travis Hunter is impressing at training camp\"","url":"https://www.espn.com/nfl/story/_/id/45900102/jacksonville-jaguars-receiver-travis-hunter-two-way-player-first-two-weeks-training-camp","published":"2025-08-05"},{"claim":"Jordan Addison was suspended for the first three games of the 2025 season under the NFL's substances of abuse policy.","source":"ESPN, \"Vikings WR Jordan Addison suspended 3 games by NFL\"","url":"https://www.espn.com/nfl/story/_/id/45909344/vikings-wr-jordan-addison-suspended-3-games-nfl","published":"2025-08-05"},{"claim":"Miami traded tight end Jonnu Smith to the Pittsburgh Steelers on June 30, 2025.","source":"CBS Sports, \"Jalen Ramsey traded to Steelers, Dolphins receive Minkah Fitzpatrick in blockbuster deal\"","url":"https://www.cbssports.com/nfl/news/jalen-ramsey-traded-to-steelers-dolphins-receive-minkah-fitzpatrick-in-blockbuster-deal","published":"2025-06-30"},{"claim":"Darren Waller came out of retirement on July 1, 2025, and was traded from the Giants to the Dolphins, one day after Miami traded Jonnu Smith.","source":"ESPN, \"Darren Waller unretiring as Dolphins acquire TE in trade\"","url":"https://www.espn.com/nfl/story/_/id/45631064/darren-waller-unretiring-dolphins-acquire-te-trade","published":"2025-07-01"},{"claim":"The Colts named Daniel Jones their starting quarterback over Anthony Richardson on August 19, 2025.","source":"ESPN, \"Colts name Daniel Jones starting QB over Anthony Richardson\"","url":"https://www.espn.com/nfl/story/_/id/46015804/sources-colts-name-daniel-jones-starting-qb-anthony-richardson","published":"2025-08-19"},{"claim":"Ja'Marr Chase entered 2025 as the consensus first overall pick in fantasy drafts.","source":"Sports Illustrated, \"Fantasy Football's Undisputed No. 1 Pick: Ja'Marr Chase\"","url":"https://www.si.com/onsi/fantasy/nfl/fantasy-football-undisputed-no-1-pick-ja-marr-chase","published":"2025-06-16"},{"claim":"Emeka Egbuka drew praise from Buccaneers coaches for his route running in 2025 training camp.","source":"Buccaneers.com, \"Training Camp Takeaways: Emergence of Emeka Egbuka and Tez Johnson, Antoine Winfield Jr. Splash Plays and More\"","url":"https://www.buccaneers.com/news/training-camp-takeaways-emergence-emeka-egbuka-and-tez-johnson-antoine-winfield-jr-splash-plays-more","published":"2025-07-25"},{"claim":"Christian McCaffrey was limited to four games in 2024 by calf/Achilles and PCL injuries.","source":"CBS Sports, \"Christian McCaffrey says he feels 'great' at 49ers minicamp as he returns from injury-plagued 2024 season\"","url":"https://www.cbssports.com/nfl/news/christian-mccaffrey-says-he-feels-great-at-49ers-minicamp-as-he-returns-from-injury-plagued-2024-season/","published":"2025-06-11"},{"claim":"Saquon Barkley rushed for 2,005 yards in 2024.","source":"CBS Sports, \"Saquon Barkley surpasses 2,000 rushing yards: Eagles star becomes ninth RB to reach rare season milestone\"","url":"https://www.cbssports.com/nfl/news/saquon-barkley-surpasses-2000-rushing-yards-eagles-star-becomes-ninth-rb-to-reach-rare-season-milestone/","published":"2024-12-29"},{"claim":"Bijan Robinson entered 2025 drafts as the top-ranked fantasy running back.","source":"Yahoo Sports, \"Bijan Robinson's Fantasy Football Outlook For 2025 NFL Season\"","url":"https://sports.yahoo.com/article/bijan-robinson-fantasy-football-outlook-215435586.html","published":"2025-08-03"},{"claim":"Derrick Henry rushed for 1,921 yards and 16 touchdowns in 2024, his first season in Baltimore, at age 30.","source":"NBC Sports, \"Derrick Henry fantasy football preview 2025: Stats, season outlook, predictions\"","url":"https://www.nbcsports.com/2025-fantasy-football-player-previews/news/derrick-henry-fantasy-football-preview-2025-stats-season-outlook-predictions","published":"2025-08-05"},{"claim":"Ashton Jeanty entered 2025 controlling the Raiders' early-down carries, with Raheem Mostert projected only for third-down work.","source":"NBC Sports, \"Ashton Jeanty fantasy football preview 2025: Stats, season outlook, predictions\"","url":"https://www.nbcsports.com/2025-fantasy-football-player-previews/news/ashton-jeanty-fantasy-football-preview-2025-stats-season-outlook-predictions","published":"2025-08-11"},{"claim":"Travis Kelce's 2024 ended his run of 1,000-yard seasons and left him fifth among tight ends in PPR scoring.","source":"Sports Illustrated, \"Can Chiefs TE Travis Kelce Bounce Back In 2025 Fantasy Football After A Down Year?\"","url":"https://www.si.com/onsi/fantasy/nfl/kansas-city-chiefs-te-travis-kelce-bounce-back-2025-fantasy-football","published":"2025-07-14"},{"claim":"Jaxon Smith-Njigba caught 100 passes for 1,130 yards in 2024 and became Seattle's clear top target for 2025 after DK Metcalf was traded and Tyler Lockett released.","source":"CBS Sports, \"Fantasy Football fallout: D.K. Metcalf requests trade, Seahawks cut Tyler Lockett, Jaxon Smith-Njigba a WR1?\"","url":"https://www.cbssports.com/fantasy/football/news/fantasy-football-fallout-seahawks-to-trade-d-k-metcalf-cut-tyler-lockett-is-jaxon-smith-njigba-a-wr1/","published":"2025-03-06"},{"claim":"Jacksonville traded up from No. 5 to No. 2 to take Travis Hunter, sending Cleveland the No. 36 and No. 126 picks and the Jaguars' 2026 first-round pick, and said it would start him at receiver while working him in on defense.","source":"ESPN, \"Jaguars trade up to No. 2, pick Travis Hunter in NFL draft\"","url":"https://www.espn.com/nfl/story/_/id/44841310/jaguars-trade-no-2-pick-travis-hunter-nfl-draft","published":"2025-04-24"},{"claim":"As of late August 2025 Quinshon Judkins was the only player from the 2025 NFL draft class who had not signed a rookie contract, with the league still investigating and the Browns and player apart on guaranteed money.","source":"NBC Sports Pro Football Talk, \"Browns have no update on status of unsigned second-round pick Quinshon Judkins\"","url":"https://www.nbcsports.com/nfl/profootballtalk/rumor-mill/news/browns-have-no-update-on-status-of-unsigned-second-round-pick-quinshon-judkins","published":"2025-08-23"},{"claim":"Washington traded Brian Robinson Jr. to San Francisco on August 22, 2025 for a 2026 sixth-round pick after he fell out of favor, leaving Austin Ekeler, seventh-round rookie Jacory Croskey-Merritt and Chris Rodriguez Jr. in the backfield.","source":"The Baltimore Sun, \"Commanders trade RB Brian Robinson Jr. to 49ers for draft pick\"","url":"https://www.baltimoresun.com/2025/08/22/commanders-49ers-trade-brian-robinson/","published":"2025-08-22"},{"claim":"The Rams released Cooper Kupp on March 12, 2025 after failing to trade him at the $20 million he was owed for 2025, and Seattle signed him to a three-year, $45 million deal.","source":"ESPN, \"Source: WR Cooper Kupp joins Seahawks on 3-year, $45M deal\"","url":"https://www.espn.com/nfl/story/_/id/44254640/sources-wr-cooper-kupp-join-seahawks-3-year-deal","published":"2025-03-14"}]},"sections":[{"id":"cold-open","title":"Season Four","placement":"before_rankings","paragraphs":["Three seasons, three champions, and Ben in all three finals. Karim took the first one off him 154.62 to 95.38. Blake took the second 163.86 to 149.56. Last December he finally got one, 182.28 to 176.58 over Zach, the closest final this league has held.","Nobody here has won it twice, and it has not been for want of chances. Karim came back the next season and was knocked out in December. Blake came back last season and lost twice in December, the semifinal and then the third place game. Ben walks in third to try it.","What he is defending against no longer resembles itself. Zach rosters thirteen receivers, four of whom were first round fantasy picks once and mostly will not be again. David rosters three running backs and four defenses. Nate paid his 2026 first, his 2026 second and Rhamondre Stevenson for one rookie who plays two positions, and Jacksonville paid roughly the same freight for the actual player. Matt has Jahmyr Gibbs and Ashton Jeanty and a receiving corps of rookies. Kevin has thirty six players, seven of them tight ends, and a lineup starts one. Ben has to beat all of that with a roster he barely touched.","The summer that produced these teams was not, for the most part, spent on them. Kevin launched a hot sauce company in April and Patrick opened a law practice the same month. Brent spent a weekend at a festival and filed reviews. Karim answered the board hours late from another time zone, and Oscar lost a first round pick outright to a work emergency. The decisions below were made in the gaps."]},{"id":"draft-diary","title":"Eleven Days in July","placement":"after_rankings","paragraphs":["The league voted to run its first slow draft, twelve hours a pick, and then found out what a twelve hour clock actually does. It makes waiting worth something. Blake said so out loud while the room complained about his pace: “I’m def taking every minute. I still have to start my research”. Nobody was persuaded. Matt had been ready since January, having diagnosed himself in April (“im so over prepped its probably detrimental”) and described his July with total accuracy: “I'm literally Kevin Costner in Draft Day right now”. Brent narrated the delay live: “Most anti climatic start to a draft in history”.","What the clock did first was redistribute sleep. Matt, holding the 1.01 and unable to do anything with it, filed the grievance on behalf of everyone at the front of the order: “Karim and Brent sleeping peacefully. Meanwhile those of us with action in 1st haven’t slept for days”.","Then Patrick took Quinshon Judkins at 1.07 and, a day later, the Browns rookie was arrested in Florida on a misdemeanor domestic violence battery charge. Waiting stopped being a personality trait. Zach saw it immediately: “Ooooff. That’s the risk of starting the draft so early”. Blake, on the clock at that exact moment, spoke for everyone still holding a pick: “Yeah you guys suck for doing this”, and later put the principle plainly: “Never know when the next story like Judkins will hit the wire”. Nine days of draft were left, and every owner in it had just watched a first round pick change value overnight.","Then Patrick took Quinshon Judkins at 1.07 and, a day later, the Browns rookie was arrested in Florida on a misdemeanor domestic violence battery charge. Waiting stopped being a personality trait. Zach saw it immediately: “Ooooff. That’s the risk of starting the draft so early”. Blake, on the clock at that exact moment, spoke for everyone still holding a pick: “Yeah you guys suck for doing this”, and later put the principle plainly: “Never know when the next story like Judkins will hit the wire”. Nine days of draft were left, and every owner in it had just watched a first round pick change value overnight.\n\nThe man who took it hardest owned none of it. Nate is the league’s only Browns fan. “Unreal. Fucking browns”, he typed, which is the entire history of that franchise, and David offered the only consolation available: “Least you get a new stadium…”.","The clock collected from everyone else too. Oscar lost the 1.06 outright when a work emergency ran his twelve hours out and the auto draft chose for him. Three picks later Blake, the format’s loudest defender, fat fingered Kaleb Johnson at 1.09, asked for it back, studied the board while the room argued about whether he could have it, and withdrew the request: “Actually looking at everyone, I’m good”.","The only rule the format could not enforce was the one the league invented itself. Kevin held the compensatory 2.13 that goes to the winner of the losers bracket and made the mistake of naming his target out loud, which is how Matt came to set the protocol in one line: “okay so we all just dont pick ferguson”. Zach called the ending two days early (“This is gonna get dicey when someone accidentally autodrafts Ferguson”) and was wrong about a single word. David took Terrance Ferguson on purpose, in the open, without comment. Kevin’s alarm was immediate (“Violation!”) and his incident report was better: the culprit “Sprinted that pick to the podium”. A commissioner then reversed a draft pick by decree inside ninety minutes, and the league spent part of an afternoon adjudicating the ownership of a tight end, and awarded him to Kevin, who now rosters seven of them."]},{"id":"hunter-hearing","title":"The Travis Hunter Problem","placement":"after_rankings","paragraphs":["This league starts a defensive back, and the defensive back is the cheapest thing in the lineup. Travis Hunter arrived in Jacksonville promising to play both ways, and through training camp the Jaguars held to it, running him at receiver and at cornerback in the same practices. Sleeper, facing a player without a precedent, listed him at both DB and WR. So a real NFL receiver might be startable at the position nobody wants to spend on, and Nate paid the 1.04 to find out what that is worth.","The objections were good. Karim went straight to the invoice: “You just used a first on a db Nate”. Brent found the only precedent available, and it is the right one: “Yeah this 6’1 195 lb kid is gonna play both ways in the nfl”, then “When Charles Woodson couldn’t”. Harlow did the arithmetic in public, because decent defensive backs already produce like second receivers: “He needs to average 15+ to be better than good DB IDP’s”. And Kevin found the detail that decides it, since tackles are the one defensive category a corner can produce every week: “He intentionally avoids tackling.” Interceptions and breakups still pay, and this league gives two points for a breakup, but they arrive in clusters nobody can schedule. Take the tackles away and the receiving line has to carry all of it.","Nate’s response to being outnumbered was to go find a witness who agreed with him. He consulted the most agreeable expert available and reported back: “ChatGPT doesn't lie. I told it I can use thunters offensive stats in my db slot....” Ben, who is not in the habit of correcting anyone, made an exception: “I’m actually mostly with you on Hunter’s value, but just for the record, ChatGPT lies all the time lol”. Kevin added the footnote: “It’s also very sycophantic”. Nate switched engines. Kevin updated the threat assessment accordingly: “Uh oh, Nate’s weaponizing Grok. Mail him the trophy now Ben”.","What should worry the eleven teams that passed is who quietly agrees with him. Zach crossed over completely (“I hate to say it but I’m with Nate on this one”), proposed abolishing the DB slot for next season in the same breath, and admitted he intends to buy the player eventually anyway. Ben, who had already explained the mechanic more clearly than its owner (“He also doesn’t need to play much on defense to still be classified as a DB.”), sketched the endgame without raising his voice: “But we can also always just collude against Nate and get rid of the db spot if it becomes too much of a cheat code”. The reigning champion thinks Nate might be right, and thinks the answer to that is a rule change. Nate’s own last word, filed on kickoff eve off a Jaguars post, was less measured: “OMG THUNTER going for 1400+yds as a rookie WR this year!!!!”"]},{"id":"superlatives","title":"The Offseason Trophy Case","placement":"after_rankings","items":[{"label":"Failed Coup of the Summer","text":"Nate went 3-13 in 2023 and this league has never accepted that it was an accident. Mid draft this July, when he objected that Brent was table talking during someone else’s pick, the reply skipped the rules entirely: “Just like there was no rule on you tanking”. That is the man who moved to replace the commissioner.\n\nThe motion had a March prequel, and the prequel is the better story. Nate wanted the draft board updated and said so at length. What he did not know was where the commissioner was standing. Brent replied that the message was “what employees who are ineffective at using their time do”, mentioned that he was “currently in Berlin trying to grow my business”, invited Nate to calm down, and pointed out that the vote he was demanding had already passed in a document Nate had been shared on three times. Nate changed careers on the spot: “I thought the vote passed to draft earlier. And didn't know you were in Berlin. Goodluck with the bizniz!”\n\nBy July it was a formal motion: “Lets all remind ourselves he works for us. I motion to challenge Brent in 2026 for commissioner! I need 2 seconds to put it to a vote. Who wants change?!!” Kevin voted “Nay”. Zach filed him under “#insurrectionist” and offered a consolation post: “I’m down to appoint you to some sort of deep state admin role”. The motion died for want of a second."},{"label":"Longest Negotiation","text":"Matt and Kevin closed a Tyler Allgeier deal during round one of the draft, ending a discussion that began sometime in a previous geological era. Matt: “must be the longest trade negotiation in history”. Kevin: “Years of foreplay finally culminating”."}]},{"id":"kickoff-eve","title":"Thursday","placement":"after_rankings","paragraphs":["Two men have carried a title into a new season here and neither kept it. The third spent his summer auditioning kickers and marveling that the rookie draft had grown a round. Depending on which of the eleven teams behind him you ask, that is either the most reassuring fact of the preseason or the most alarming one.","Most of this page has told you something. Nate has filed his championship in advance, the way he filed the Cavs in seven, so the record will show he called it. Zach has published the date he starts selling. Matt has named the outcome that would hurt worse than losing. David has said “Tet all day” and gone back to his cartoon. Harlow has bought two years of somebody else’s bad luck and has to sit with it. Even the champion left one thing on the record, and it was a projection about somebody else’s rookie. That is a season’s worth of receipts, and the man holding the trophy wrote almost none of them.","On Sunday, in Jacksonville, a rookie who spent all of training camp lining up on both sides of the ball will do whatever the Jaguars have actually decided to do with him, and in one lineup in this league he will be sitting in the defensive back slot. Whatever number comes out of that slot is the first real thing anybody learns this year. Everything else here is still an argument."]}],"rankings":[{"rank":1,"team_name":"Kittler on the Roof","owner":"Ben","record_2024":"13-3","blurb":"Start with what he did. He stacked Tucker Kraft, Elijah Arroyo and Thomas Fidone behind George Kittle, who turns thirty two in October. He cycled through four kickers and settled on Matt Gay. That is the offseason.\n\nWhat he did not do is longer. He did not add a running back, and carries five, fewer than any other contender. He did not trade a receiver, though Joe Burrow throws to Puka Nacua and Garrett Wilson and somebody would have paid. He did not answer the two month argument about Travis Hunter except once, in a single measured paragraph, before going quiet again: “I think there’s a pretty decent chance he’s able to put up wr2 numbers out of a DB spot for a couple years, but one way or another that won’t be something that happens long into his career.” He did not react when the league added a round to the rookie draft, beyond noticing it had happened: “I forgot we added a 6th round. Y'all are a bunch of maniacs lol.” When somebody floated setting dues by height, he found the only angle that concerned him: “I'm ok with this if it means I pay less in buy ins”.\n\nOver the fourteen weeks that set the standings, three teams outscored him: Zach, Brent and Blake, the last of them by eighteen points across the whole stretch. He then beat Zach in the final by 5.70, having beaten Nate by twenty one to get there, and answered the winter by changing nothing. The case for him is that the margins were his and he kept the roster that produced them. The case against is that a five point final is not a repeatable process, and he has not added anything that would widen it.\n\nOne subject moves him. In May, Green Bay’s proposal to ban the tush push, the play Zach’s quarterback is built on, died at the league meeting, and Ben filed a disclosure: “My attempt, as part owner of the packers, to sabotage Zach’s team sadly failed.” In February Dallas sent Luka Doncic to Los Angeles. On August 28 Dallas so thoroughly mishandled Micah Parsons that the best pass rusher alive became a Packer for Kenny Clark and two firsts. Zach sent him the news. “First Luka and now this. Dallas has been very good to me this year.”\n\nHe is the only man here defending a title, and he spent the summer conducting himself like a man whose season was somebody else’s problem."},{"rank":2,"team_name":"MHJTIME","owner":"Nate","record_2024":"12-5","blurb":"Nate files things. Not opinions exactly, filings, entered into the record with the date attached so that later somebody can look them up.\n\nFebruary, mid argument about basketball, apropos of nothing: “Cavs in 7 vs Boston. Just documenting it now so I can refer back.”\n\nMarch, told the commissioner had not updated the draft board, he worked the order out himself, posted all twelve slots off reverse max points and playoff finish, conceded in the same breath that it was not final, and clarified the reporting structure on his way out: Brent “works for us”.\n\nAlso March, deep in an NBA thread and feeling good: “do yall understand im about to win a Jailyard fantasy football championship in 2025?”\n\nThe roster mostly backs him. Ja’Marr Chase went into 2025 as the consensus first pick in fantasy drafts, Malik Nabers and Marvin Harrison line up beside him, Jayden Daniels runs it and Trey McBride plays tight end. That is the highest ceiling anybody here can field. It cost his 2026 first, his 2026 second and Rhamondre Stevenson, all of it for the 1.04 and Travis Hunter, and Harlow is holding the paper.\n\nWhich leaves the backfield, and the backfield is where the filings stop and the scrambling starts. Chuba Hubbard came over from Zach mid draft. Zach reviewed it in four: “Your backfield is trash”. Nate answered with what became the season’s thesis and its problem at once: “I just need avg rb play.” then “Elite everywhere else.”\n\nSo August was an audition. He dropped Chris Rodriguez, bought him back, and announced him: “Chris Rodriguez is the guy. Rb1 for the commies. I might have saved my ass.” Brent watched the whole cycle and summed it up: “Nate you are like a paper in the wind my man”. Then Washington actually settled it, and settled it against him. On August 22 the Commanders traded Brian Robinson, whom Nate already owned, to San Francisco for a 2026 sixth, having quietly moved him out of the plan; the job went to Austin Ekeler and a seventh round rookie named Jacory Croskey-Merritt. On the eve of the season he went to Blake and traded for Jerome Ford.\n\nFour answers at one position in three weeks, from the one owner who cannot go buy a real one, because everybody holding a running back is chasing him. He may lead this league in scoring and lose in the first week of December to a hamstring, and the file will be right where he left it."},{"rank":3,"team_name":"General Ken-obi","owner":"Blake","record_2024":"11-6","blurb":"Blake scored 2,152.26 over the fourteen weeks that set the standings, third behind Zach and Brent, and then finished the year with the largest raw total in the league because he was still playing in January. What it bought was a third seed and two December losses, the semifinal to Zach and the third place game to Nate, by a combined 17.70 points.\n\nThe skill players are not the argument. CeeDee Lamb, Nico Collins, Drake London, Chris Olave, Jameson Williams and DJ Moore would start anywhere here, and Saquon Barkley, coming off 2,005 rushing yards, sits in front of Kenneth Walker and Chase Brown. The quarterbacks are. Drake Maye, J.J. McCarthy, Trevor Lawrence, Anthony Richardson: four unproven answers to the one question every team above him has already settled, and in August Indianapolis removed one of them by handing the job to Daniel Jones.\n\nHe buried it himself: “The Anthony Richardson gamble was a bust”. Read it as habit. He talks his own roster down all year and finishes in the money anyway, and the last message of the entire offseason was him doing it again to a different quarterback he owns: “As a TLaw owner, I’m very skeptical”. Pointed at somebody else’s team the same instinct turns into a joke, as when Geno Smith landed in Las Vegas with the coach who once traded him away: “Geno showed Pete Carroll he could love again after his breakup with Russell .”\n\nHe rosters eight running backs and ten receivers in a league where four teams are drowning in backs and two of them need receiving help. Every piece required to fix the quarterback room has been sitting on his own bench all summer. The one trade he did make was to send Jerome Ford to the team ranked above him on the eve of the season, which is a transaction, not a repair. Third is where the deepest collection of skill players in the league sits behind a coin flip."},{"rank":4,"team_name":"Sleeping Giants","owner":"Zach","record_2024":"11-5","blurb":"Zach lost the title game by 5.70 and ran the same team back. No team scored more per game, and it starts with Derrick Henry, Josh Jacobs and Kyren Williams, three backs who carry their offenses, with Jalen Hurts in front of them.\n\nThen there are the receivers, and the honest way to describe that room is to describe what the actual NFL did with those men this year. Cooper Kupp was owed twenty million, and when the Rams could not find a trade partner at that number they released him outright in March; Seattle took him home for three years and forty five million. Jordan Addison is suspended for the first three games. Mike Evans, Stefon Diggs, Keenan Allen and DeAndre Hopkins were all first round fantasy picks once. Zach keeps thirteen of them, which is what a man does when he refuses to be the one who sold the year they came back.\n\nThen there is the tight end sequence. Miami traded Jonnu Smith to Pittsburgh at the end of June, taking Zach’s starter with it, and he took the loss philosophically: “There’s no such thing as a secure TE”. The next day Darren Waller came out of retirement and was traded to Miami to fill the hole Jonnu left. Zach signed him off the free agent list within hours and was selling him as literature half an hour after that: “He was in a dark place after the injury and divorce man. This is his second coming”. He replaced his own tight end with the man hired to replace his own tight end, and then marketed the replacement as a resurrection.\n\nHe has also published his exit, which nobody else here has done. In late August he hung a sign on the roster (“I’ve got league winner RBs”) and named the trigger: “If things go south first 5 weeks for me record wise, someone can solidify their run to the chip”.\n\nTell him the backfield is old and he does not argue the actuary’s side. He argues the other one: “Henrys gonna go til he’s 40 tho and Kyrens only 24”. Henry ran for 1,921 yards and 16 touchdowns at thirty last season, which is not supposed to happen, and Zach has decided that a thing which already happened is a thing that happens. If he is right he wins the title he lost by six points. If he is wrong he becomes the most important seller in the league by Halloween, at a price he set in August."},{"rank":5,"team_name":"Rasheeing the Scene","owner":"Patrick","record_2024":"10-6","blurb":"By the fourth week of August, Patrick’s first round rookie was the only player from the entire 2025 draft class who had not signed a contract.\n\nQuinshon Judkins went at 1.07 in July. A day later he was arrested in Florida. In August prosecutors declined to pursue the charge, and Patrick, who does this for a living, drew the line his profession requires and refused to extend it: “Thank god my top pick is not a criminal, probably just a huge piece of shit of a guy.”, and then, asked whether a suspension was coming anyway, “Certainly a possibility a la Zeke. But not an inevitability.” He was right to hedge. The league kept investigating, Cleveland and the player fought over guaranteed money, and by late August the Browns had no update to give and Judkins had no contract.\n\nThe other catch wears the team name. Rashee Rice lost 2024 to a knee injury after four games, and on August 27 the NFL suspended him for the first six of 2025, so Patrick’s best receiver will have played roughly a quarter of a season across two years by the time he returns. His entire response: “omg Rashee Rice was suspended no way I had no idea that was possible I am 100% shocked”.\n\nAnd he is still fifth, because everything underneath the mess is built correctly. 7-10, then 8-8, then 10-6, without ever raising his voice. Josh Allen is the most valuable asset anybody here owns. Behind him are ten running backs, which elsewhere on this page is a symptom and here is not, because De’Von Achane, Bucky Irving, Travis Etienne and Trey Benson will all start NFL games. On August 22, the same afternoon Washington traded Brian Robinson away and handed its backfield to Austin Ekeler and a seventh round rookie, Patrick posted the whole shuffle and already owned the right side of it: “Ekler and baby Commanders rbs”. The second ranked team spent the following fortnight chasing that same backfield in circles.\n\nHe has a stated rule, “Best WR available. That’s it.”, and because a Chargers fan saying that about a Chargers player invites a certain suspicion, he offered the test himself: “I’ll prove it. I’ll trade you my two chargers, dicker the kicker and Tre Harris, for raider Brock Bowers, the Chargers hated rival”. He put his own fandom up as collateral to settle an argument about process, in a thread nobody was going to remember.\n\nBrent needs two years of young players to mature. Patrick needs to still be in the race in week seven."},{"rank":6,"team_name":"The Boonist Monks","owner":"Brent","record_2024":"7-9","blurb":"Across the fourteen weeks that set the standings, Brent’s offense was the second most productive in the league. He went 7-7 in them, scraped into the bracket, and was gone in a week, beaten by Blake by 4.18 points for the second December running. He has been on the record about the sequel since March: “3rd times the charm”.\n\nThe reputation is that the roster is old and the famous names carry it. Travis Kelce’s 2024 ended his run of thousand yard seasons and left him fifth among tight ends. Alvin Kamara, Tyreek Hill, Nick Chubb and Adam Thielen complete the impression. Nate has been saying it for two years. For two years Brent has answered the same way: “It gets younger every year”.\n\nHe is closer to right than the joke allows. Jaxon Smith-Njigba caught 100 passes last season and then inherited the entire Seattle target share when DK Metcalf was traded and Tyler Lockett released. Zay Flowers and James Cook are ascending. Lamar Jackson is the best quarterback on any roster here. Terry McLaurin’s holdout ended in late August, which Zach flagged the same day as a “Big day for @Brent Boone”.\n\nThe live fight is Chubb. Houston put Joe Mixon on the non football injury list and named Chubb the week one starter. Nate, who had tried to buy Chubb in July out of pure affection (“because I love him. my favorite brown of all time. and hes good value”) and been refused, spent kickoff eve declaring him finished. Brent answered with the incredulity he uses when he is confident: “Sure buddy. That’s why he got named starter. Because nfl teams with championship aspirations start vets with bad knees over young talent”.\n\nHis philosophy arrived the same night in two consecutive messages: “The future is fucked bro” and “Live for the now!” Read the summer and it stops sounding like a rationale for an old roster. In February he reviewed the championship halftime show like a man with a beat (“Kendrick’s lyricism is unmatched”), then volunteered, with nobody having asked about the other performer, “I honestly couldn’t tell you the name of one JLO song”. In April he was at a festival sending back dispatches, Zedd “was one of the most unreal shows I’ve ever seen in my life”, Gaga’s “show was fucking insane”, dinner at a Nobu pop up with the stage still in view. He is also the commissioner, which puts the league’s future in the hands of the man least interested in his own.\n\nA roster of thirty year olds is not a mistake he made. It is the same sentence he says about everything. He needs one more year of the young half arriving faster than the old half leaves."},{"rank":7,"team_name":"The Legion of Bouz","owner":"Karim","record_2024":"7-9","blurb":"In July, Karim renamed nothing and simply floated “#TyroneTracyTime” about his own running back. Nothing happened. A day later he pushed: “Shall I change my team name to #SKATTABOTIME?!?!” Still nothing. In August he tried it on a rookie who belonged to Brent, “#THORTONTIME”, and finally drew the response he had been fishing for since the spring, because Nate’s franchise is MHJTIME and Nate treats the suffix as property: “Karim my lawyers are sending over a cease and desist notice to your organization”. Oscar, who practices law, offered to defend him free. Karim did not need it. He beat the claim by translating the infringing element into Spanish: “#THORTONTIEMPO!”\n\nThe roster is a health bet. Christian McCaffrey played four games in 2024. Upright, a lineup with Amon-Ra St. Brown, DeVonta Smith, Jaylen Waddle and Patrick Mahomes is a contender, and the best of those came from Oscar’s rebuild for the picks Oscar then turned into running backs, a single trade that shaped both ends of this list. Not upright, the cover is an aging Aaron Jones and a Joe Mixon already on the shelf, and the season is over by Halloween.\n\nSo he bought both halves of the New York Giants backfield, Tyrone Tracy and then Cam Skattebo, which is why his one public prediction covers them jointly: “Tracy and Skatt finish as RB2s in 2025. First hot take!” Owning a committee is the only honest way to bet on one of its members.\n\nGetting Skattebo required reversing himself in public. Nate, mid draft, said he was targeting Skattebo so the two would not collide, and Karim said he had no interest. Karim then spent back to back picks on Cam Ward and Cam Skattebo. Nate called him a jabroni. Karim conceded everything (“Haha this is all true”), offered one procedural defense (“But we agreed to give everyone 12 hrs to pick”), and then supplied the motive nobody had asked for: “It’s cos I been watch Skattabo highlights all day”.\n\nHe plays this league from the United Kingdom, which made July expensive. Two of his trades came apart and had to be redone. Oscar reconstructed a typical day without malice: “You had back to back picks and then picked the guy highest ranked in the system hours later and trade fuck up after lol”. Karim’s own account arrived at an hour when nobody else was awake: “Just woke up”. Pressed on an error, he produced the defense of a man with a life: “It’s alright us dads don’t get much time for accuracy #tradegate”.\n\nThere is a title in this roster and a top four pick in it, and almost nothing in between."},{"rank":8,"team_name":"Noble FFT","owner":"Kevin","record_2024":"5-12","blurb":"The names say contender. Bijan Robinson went into 2025 drafts as the top ranked back. Breece Hall is behind him. A.J. Brown and Tee Higgins are outside. Tyler Warren is at tight end, Caleb Williams at quarterback, and Micah Parsons, who just cost Green Bay two first round picks in real football, plays defense for him.\n\nThe scoring says otherwise. Across the fourteen weeks that decided last season Kevin finished tenth in points and went 2-12. The season total that looks respectable looks that way because he played three extra games in the consolation bracket.\n\nThe gap is on the roster sheet. Thirty six players, six more than the smallest roster in the league. Seven tight ends. Twelve receivers. Two kickers. A lineup starts one tight end.\n\nHe acquires and does not release. In July a commissioner spent part of an afternoon awarding him a seventh tight end over the objection of the owner who had drafted the player. Two of his own picks went up for sale in the same small-hours sitting, “Pick 7 is open for trade!” and then “Pick 8 is available for trade!” Another morning of offers was greeted the way other men greet a birthday: “I love waking up to trade offers so let’s keep it going 3 days in a row”.\n\nHe knows. Mid draft he named it himself, in the vocabulary of appetite: “All this deal making has me calling people for real world business deals just to get my fix lol”. That is not a figure of speech from an idle man. In April he launched a company, and the announcement carried the year’s finest piece of punctuation: “Friends and league members (and Nate), I started a hot sauce company.” Ben, who speaks about once a season, surfaced to report that the pitch had merely “Mostly had me at” the friendship and definitely had him at “hot sauce”. Brent supplied the scouting report, “He’s been snorting hot sauce and watching film”, and Kevin pled guilty: “Scouting department of Noble FFT never sleeps”.\n\nNobody here is better at finding a good player and nobody is worse at deciding which good players he does not need. Contenders will trade for tight ends and receivers in October, which puts him one phone call from a bracket he has never reached, and the phone call requires him to give something up."},{"rank":9,"team_name":"Chudders Football Team","owner":"Matt","record_2024":"6-11","blurb":"Gibbs and Jeanty will score points. Jahmyr Gibbs is the kind of back most rebuilds never get to keep, and Ashton Jeanty walked into a Las Vegas backfield he controlled on early downs from the day he arrived. Emeka Egbuka had Tampa Bay’s coaches talking about his route running by late July. Justin Herbert is the only man here with a resume, and behind that group the receivers are rookies and dart throws.\n\nNone of that is the interesting part. Hours after the draft closed, Matt named a fear better than being bad: “I’m mildly concerned I’ll be midling enough to not be at the top next year. I think I need another year of high picks”, and then, in case that was too subtle, “Or perhaps be stuck in mediocrity”.\n\nHe has finished last in scoring in two of the last three seasons without losing a night’s sleep. Seven wins would cost him one."},{"rank":10,"team_name":"Father Time ","owner":"David","record_2024":"7-9","blurb":"David has the best young receivers in the league and cannot build a lineup around them. Brian Thomas, Ladd McConkey, Rome Odunze and Tetairoa McMillan are four players any team here would take. Behind them are three running backs, the fewest by a distance, plus five quarterbacks and four defenses on a roster that starts one of each.\n\nOn draft night he held 1.03 with Travis Hunter available and took McMillan. He gave two reasons and then stopped talking.\n\nThe first was portfolio: “Fair, I dont want two jags is why i passes”. He already owned Brian Thomas, and Jacksonville had just spent its 2026 first, plus the 36th and 126th picks, moving up three spots to take Hunter, which is a lot of new mouths for one quarterback.\n\nThe second was a matchup he could see: “All fair, I just liked the size difference between Tet and Young. Gonna be hard to over throw someone that big”.\n\nThen: “Burgers have been cooked and finished”. The surname is Hamburger and the league shortened it to Burger years ago, which is the only reason a team called Father Time rosters the youngest receiver corps in football.\n\nZach saw the plan (“Burgers got the blueprint quietly over there. Stacking young wideouts for 2-3 years”) and Brent named it: “Burger is wide receiver island”. The island has no bridge. Those quarterbacks and defenses are exactly what a team with three running backs should be trading. Patrick spent the summer trying (“I’m trying to trade him RBs for some of those WRs right now, but dude is MIA”). Nate offered a 2027 first for Shedeur Sanders and got silence.\n\nHe is not, however, uninterested. He defended the McMillan pick at length on draft night, and the one subject outside football that ever got him going arrived in late July: “Anyone watch the new south park yet?”, then “Its so fucking funny”, then “Im dying!! I dont want to spoil it. Anyone who hasnt, its 30 mins of must see”. On August 28, with the chat filling up over Parsons, he posted once and left: “Jerry Jones is my favorite 49ers supporter!”\n\nOn the eve of the season, told Hunter changes Jacksonville, he restated his position without moving: “Tet all day”. He may be right about every part of it. None of it scores a point in 2025."},{"rank":11,"team_name":"Burden of Etienne-y Woody","owner":"Harlow","record_2024":"6-10","blurb":"In March, Nate needed the 1.04 and Harlow owned it. The price was Nate’s 2026 first, his 2026 second and Rhamondre Stevenson, and Harlow explained it like a man who had run the model: “Mondre was a throw in, next years 1st was the cornerstone for me”. Kevin scored it that night, and wrapped the compliment in a curse: “You just officially jinxed yourself with the fantasy gods. Congrats Harlow, you’ve won the trade”.\n\nThe league has called it free money ever since. It is not.\n\nHarlow only wins if Nate’s next two years go badly. If Hunter becomes what Nate says he is, and Nate finishes where he expects to, those picks convey late and Harlow will have sold the best player in the deal for two lottery tickets bought at the top of the market. He has purchased a rival’s misery and has to wait two seasons to learn whether it arrives.\n\nA real front office made the same wager on the same player and paid a similar bill. Jacksonville sent the 36th pick, the 126th pick and its own 2026 first to Cleveland to climb three spots and take Hunter second overall, then said it would start him at receiver and work him onto defense gradually. Two organizations mortgaged the same future year on one man who has never played a regular season snap. Only one of them gets to keep him.\n\nWhat Harlow fields in the meantime is thin. Justin Jefferson is a genuine cornerstone and George Pickens moved to Dallas in May, which could give him two brand name receivers before Luther Burden catches a pass. Behind that it is committees: eleven running backs, more than anyone in the league, and almost none who will start a week that matters. That is the lineup, and that is why he is eleventh.\n\nHe reads players better than his record shows. He did the arithmetic on Hunter while everyone else traded opinions, he scouted Devin Neal off tape (“He was by far the best player on that KU team”), and he spent a sixth on Will Howard as a cheap swing at a starting job. On the last day of the draft he proposed that somebody grade the league’s old drafts in hindsight and volunteered for the job: “Would be fun to have written draft recaps, look backs, and grades like 2-3 years later”. A man holding a rival’s first round pick would like the record kept on everybody. Of course he would."},{"rank":12,"team_name":"Ghastly Grayskull Gang","owner":"Oscar","record_2024":"3-13","blurb":"Oscar sees this league more clearly than anyone in it.\n\nOn draft night he handicapped a rookie tight end’s target competition without breaking stride, “Loveland will be good, he’s just like 1 of 5 first rounders catching passes in that offense.”, which is the whole Chicago problem. Watching the championship game in February he read the football through the halftime show: “This game is like Kendrick v Drake tho so pretty fitting”. When Nate spent a morning needling Brent, Oscar closed the file on a two year feud: “Damn Kamara selling real estate in NOLA while Boone lives rent free in Nate’s head”. When Nate threatened Karim with lawyers, Oscar, who actually practices law, volunteered to defend him for nothing.\n\nHis own team he cannot see at all.\n\nHe went 3-13 and finished eleventh in scoring. He had already sold Amon-Ra St. Brown to Karim (“For the record I got two first rd picks and Tank Bigsby for Amon Ra”) and what that bought him was the 1.06, Tank Bigsby and a 2026 first. He took Omarion Hampton at 1.02 off his own reverse-standings slot, then spent the Amon-Ra pick on TreVeyon Henderson while a work emergency ran his clock out and the auto draft made the selection for him. His summary was accurate and faintly stunned: “Just like that I became a running back team”.\n\nTen backs now. No lineup in football starts more than three. Ten works for Patrick seven spots up because Patrick’s ten include four men who will start NFL games; Oscar’s are mostly waiting for somebody else’s job to open, and waiting is not a season. The talent underneath is real and arriving faster here than anywhere else. Brock Bowers is one of the best young players in this league at any position, DK Metcalf and Xavier Worthy have ceilings, and the picks keep coming.\n\nTwelfth is arithmetic. The way out is a trade with one of the three teams sitting on the same problem, and of those four he is the one already saying it out loud, having sentenced himself for the autodraft without waiting for a hearing: “I’ll take it this is my L and disrespectful to the league”."}]};

(function(){
  const m = EDITION.meta;
  document.getElementById('heroHeadline').textContent = m.headline;
  document.getElementById('heroSub').textContent = m.subtitle;

  const main = document.getElementById('editionMain');

  function el(tag, cls, text){
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }

  function proseSection(sec){
    const wrap = el('section', 'prose-sec reveal');
    wrap.id = 'sec-' + sec.id;
    wrap.appendChild(el('h2', null, sec.title));
    (sec.paragraphs || []).forEach(p => wrap.appendChild(el('p', null, p)));
    return wrap;
  }

  function itemsSection(sec){
    const wrap = el('section', 'items-wrap reveal');
    wrap.id = 'sec-' + sec.id;
    wrap.appendChild(el('h2', null, sec.title));
    const grid = el('div', 'items-grid');
    (sec.items || []).forEach(it => {
      const card = el('div', 'item-card');
      card.appendChild(el('div', 'item-label', it.label));
      card.appendChild(el('div', 'item-text', it.text));
      grid.appendChild(card);
    });
    wrap.appendChild(grid);
    return wrap;
  }

  function renderSection(sec){
    return sec.items ? itemsSection(sec) : proseSection(sec);
  }

  function rankingsSection(){
    const wrap = el('section', 'rankings-wrap');
    wrap.id = 'sec-rankings';
    const head = el('div', 'sec-head reveal');
    head.appendChild(el('h2', null, 'The Preseason Power Rankings'));
    head.appendChild(el('div', 'sec-sub', 'Twelve men, twelve bets, and how likely each one is to pay this season.'));
    wrap.appendChild(head);
    EDITION.rankings.slice().sort((a,b)=>a.rank-b.rank).forEach(r => {
      const card = el('article', 'rank-card reveal' + (r.rank === 1 ? ' champ' : ''));
      card.appendChild(el('div', 'rank-no', String(r.rank)));
      const body = el('div', 'rank-body');
      const head = el('div', 'rank-head');
      head.appendChild(el('span', 'rank-team', r.team_name.trim()));
      head.appendChild(el('span', 'rank-owner', r.owner));
      head.appendChild(el('span', 'rank-chip', '2024: ' + r.record_2024));
      body.appendChild(head);
      String(r.blurb).split(/\n{2,}/).forEach(p => body.appendChild(el('p', 'rank-blurb', p)));
      card.appendChild(body);
      wrap.appendChild(card);
    });
    return wrap;
  }

  const before = EDITION.sections.filter(s => s.placement === 'before_rankings');
  const after = EDITION.sections.filter(s => s.placement !== 'before_rankings');
  before.forEach(s => main.appendChild(renderSection(s)));
  main.appendChild(rankingsSection());
  after.forEach(s => main.appendChild(renderSection(s)));

  // Source notes
  const notes = (m.source_notes || []);
  if (notes.length){
    const box = document.getElementById('sourceNotes');
    const list = document.getElementById('sourceNotesList');
    notes.forEach(n => {
      const d = el('div', 'sn');
      d.appendChild(document.createTextNode(n.claim + ' '));
      const a = el('a', null, n.source);
      a.href = n.url; a.rel = 'noopener'; a.target = '_blank';
      d.appendChild(a);
      d.appendChild(document.createTextNode(' (published ' + n.published + ').'));
      list.appendChild(d);
    });
    box.hidden = false;
  }

  // Reveal on scroll
  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => { if (e.isIntersecting){ e.target.classList.add('vis'); io.unobserve(e.target); } });
  }, { threshold: 0.06 });
  document.querySelectorAll('.reveal').forEach(n => io.observe(n));

  // Scroll progress + back to top
  const bar = document.getElementById('scrollProgress');
  const backTop = document.getElementById('backTop');
  window.addEventListener('scroll', () => {
    const h = document.documentElement.scrollHeight - window.innerHeight;
    bar.style.width = h > 0 ? (window.scrollY / h * 100) + '%' : '0%';
    backTop.classList.toggle('show', window.scrollY > 600);
  }, {passive:true});
  backTop.addEventListener('click', () => window.scrollTo({top:0, behavior:'smooth'}));

  applyConfig();
})();
</script>
</body>
</html>
