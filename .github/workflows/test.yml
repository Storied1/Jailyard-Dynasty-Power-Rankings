name: Tests

# Gate the pytest suite (scripts/tests/) on every push + PR to main.
# Companion to fetch-sleeper-data.yml, which refreshes data but runs no tests.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Run manually from the Actions tab
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history, NOT the default shallow fetch-depth: 1.
          # test_provenance_repair.py reads the 2025-08-02 attestation blob out of
          # commit d464f8c to prove admitted team names come from a real 2025 blob
          # rather than from the policy artifact. On a shallow clone that commit is
          # absent and `git show` exits 128. Deepen rather than skip: skipping would
          # leave the leak proofs green locally and vacuous on CI.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: python -m pytest scripts/tests/ -v

      # T10 idempotency gate: regenerating the expanded companions against the
      # committed manifest must write 0 files and leave the tree clean
      # (manifest-skip path — hashes INPUTS, line-ending invariant).
      - name: Idempotency gate (expanded companion manifest-skip)
        run: |
          python scripts/generate_expanded_week.py --season 2025
          git diff --exit-code -- content/weeks data/2025/nfl_games

      # Provenance public gate: the checkout-portable manifest must verify with the
      # PRIVATE chat/* inputs genuinely absent (as on this fresh runner) — the
      # public projection omits private roles + private-derived counts.
      - name: Provenance public verify
        run: python scripts/generate_chat_provenance.py --verify-public
